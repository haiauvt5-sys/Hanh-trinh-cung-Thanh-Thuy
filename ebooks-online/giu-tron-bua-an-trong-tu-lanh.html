<template id="content"><h3 class="h2">LỜI MỞ ĐẦU</h3>
<p>Chủ nhật đi chợ một lần cho cả tuần. Thịt chia túi cất ngăn đông, rau nhét đầy ngăn mát, nồi canh tối qua còn một nửa cũng đậy lại cất vào. Có lẽ đây là cảnh quen thuộc trong căn bếp của rất nhiều gia đình bận rộn, và có thể cũng là căn bếp nhà bạn.</p>
<p>Rồi một hôm bạn đứng trước cánh cửa tủ lạnh và chợt tự hỏi: <em>"Thịt để đông cả tuần có còn chất không? Rau này mua từ hôm kia, ăn còn tốt không? Nồi canh để từ tối qua, hâm lại cho con ăn có sao không?"</em></p>
<p>Tủ lạnh là người bạn rất đắc lực của các mẹ. Nhờ nó mà mình có thể đi chợ ít hơn, nấu nhanh hơn và bớt lãng phí. Nhưng tủ lạnh không phải chiếc hộp thần kỳ giữ được mọi thứ mãi mãi. Cách mình cất vào, để bao lâu và lấy ra thế nào mới quyết định bữa ăn còn ngon, còn đủ chất và còn an toàn hay không.</p>
<p>Trong cuốn ebook nhỏ này, Thuỷ muốn cùng bạn nhìn lại bốn điều rất gần gũi: đồ để tủ lạnh, tủ đông có mất chất không, cách giữ thịt cá trong ngăn đông, cách dùng ngăn mát cho rau và đồ ăn thừa, và cả tâm trạng của người đứng bếp khi nấu ăn cho gia đình.</p>
<p>Bạn không cần thay đổi cả căn bếp trong một ngày. Chỉ cần thêm vài thói quen nhỏ, chiếc tủ lạnh nhà mình đã trở thành người giữ gìn bữa ăn đáng tin cậy hơn rất nhiều.</p>
<p><strong>Thanh Thuỷ</strong> 💚</p>
<hr class="brk">
<h3 class="h2">PHẦN 1. ĐỒ ĐỂ TỦ LẠNH, TỦ ĐÔNG CÓ CÒN DINH DƯỠNG KHÔNG?</h3>
<p>Nhiều mẹ vẫn áy náy vì không có thời gian đi chợ mỗi ngày, cả nhà toàn ăn thịt đông. Tin vui là: thịt được cấp đông và bảo quản đúng cách vẫn giữ <strong>gần như nguyên</strong> giá trị dinh dưỡng. Chất đạm và các khoáng chất như sắt, kẽm hầu như không mất đi. Chỉ một vài vitamin có thể giảm nhẹ khi để lâu, lúc rã đông và lúc nấu, nhưng không đến mức biến miếng thịt thành thứ "không còn chất gì". Với gia đình bận rộn, mua thịt dự trữ là một lựa chọn hợp lý, không phải lựa chọn chữa cháy.</p>
<p>Rau xanh thì khác một chút. Rau là nguồn vitamin C quý, mà vitamin C lại rất dễ hao hụt. Một số loại rau như cải, su hào có thể mất phần lớn vitamin C chỉ trong vài ngày đầu sau khi thu hoạch. Rau bị dập nát còn mất vitamin C nhanh hơn nữa. Củ như khoai tây để lâu cũng hao dần vitamin C theo từng tháng. Vì vậy với rau, <strong>tươi là quý nhất</strong>: mua vừa đủ ăn trong vài ngày, ăn rau lá trước, củ quả để sau.</p>
<p>Và có một điều nhiều người chưa để ý: phần dinh dưỡng mất nhiều nhất thường không nằm ở tủ lạnh, mà nằm ở <strong>khâu nấu</strong>. Rau luộc quá kỹ, thịt kho quá lâu, đồ chiên rán nhiều lần đều làm hao hụt vitamin nhiều hơn chuyện để tủ lạnh vài hôm. Nấu vừa chín tới, bớt đun đi đun lại, là cách giữ chất đơn giản nhất.</p>
<p>Còn một điều nữa cần nhớ: <strong>lạnh chỉ làm vi khuẩn ngủ, chứ không giết được vi khuẩn.</strong> Ở ngăn mát, vi khuẩn phát triển chậm lại. Ở ngăn đông, chúng gần như ngừng hẳn. Nhưng khi thức ăn ấm lên, chúng lại thức dậy và tiếp tục sinh sôi. Hiểu điều này, bạn sẽ thấy vì sao cách cất và cách lấy ra quan trọng đến vậy.</p>
<div class="quote"><p><strong>Câu hỏi cho bạn:</strong></p><ul><li>Bạn có từng áy náy vì cả nhà ăn thịt đông nhiều hơn thịt tươi không? Sau khi đọc phần này, bạn thấy nhẹ lòng hơn chưa?</li><li>Rau nhà bạn thường nằm trong ngăn mát bao nhiêu ngày trước khi được nấu?</li><li>Bạn hay mua rau theo bữa, theo vài ngày, hay mua một lần cho cả tuần?</li><li>Trong bữa ăn nhà mình, có món nào đang bị nấu quá kỹ hoặc hâm đi hâm lại nhiều lần không?</li><li>Nếu chỉ đổi một thói quen để giữ rau tươi hơn, bạn muốn bắt đầu từ việc gì?</li></ul></div>
<hr class="brk">
<h3 class="h2">PHẦN 2. NGĂN ĐÔNG: GIỮ THỊT CÁ TƯƠI NGON CẢ TUẦN</h3>
<p>Nguy cơ của thịt đông thường không đến từ chuyện đông lạnh, mà từ cách mình xử lý <strong>trước khi cất vào</strong> và <strong>sau khi lấy ra</strong>. Bạn chỉ cần nhớ bốn chặng nhỏ.</p>
<p><strong>Trước khi cất.</strong> Chọn thịt cá còn tươi, sơ chế sạch sẽ, rồi <strong>chia thành từng túi nhỏ vừa đủ cho một bữa</strong>. Nhờ vậy mỗi lần bạn chỉ lấy đúng phần cần nấu, không phải rã cả khối to rồi cất lại phần thừa. Ghi ngày lên từng túi, để khi mở tủ là biết ngay túi nào cần dùng trước.</p>
<p><strong>Khi cấp đông.</strong> Cho thịt cá vào ngăn đông càng sớm càng tốt sau khi đi chợ về, ở khoảng <strong>âm 18 độ C hoặc lạnh hơn</strong>. Đừng để túi thịt nằm trên bàn bếp cả tiếng đồng hồ trong lúc mình bận việc khác.</p>
<p><strong>Khi rã đông.</strong> Cách an toàn nhất là <strong>tối hôm trước chuyển túi thịt xuống ngăn mát</strong> để thịt tan từ từ, đặt trong bát hoặc đĩa để nước không nhỏ sang đồ khác. Hôm nào quên, bạn có thể dùng chế độ rã đông của lò vi sóng, rồi nấu ngay sau đó. Hãy hạn chế để thịt trên bàn bếp cả buổi cho tan: bên ngoài ấm lên là vi khuẩn có điều kiện phát triển, trong khi bên trong vẫn còn đông cứng.</p>
<p><strong>Đã rã đông thì nấu, không cấp đông lại.</strong> Vì lạnh chỉ làm vi khuẩn ngủ, trong lúc thịt tan, chúng đã kịp thức dậy và sinh sôi. Cất trở lại ngăn đông không làm chúng biến mất, chỉ làm miếng thịt kém an toàn và kém ngon hơn sau mỗi lần như vậy. Đây chính là lý do việc chia túi theo bữa ngay từ đầu lại quan trọng đến thế.</p>
<p>Ngăn đông giữ được thịt khá lâu, nhưng chất lượng sẽ giảm dần theo thời gian: thịt khô hơn, kém thơm hơn. Thịt đông nên được dùng trong khoảng vài tháng, và với tủ đông gia đình hay đóng mở nhiều lần, dùng càng sớm càng ngon. Và khi thịt có mùi lạ, bị nhớt, đổi màu rõ, hoặc bạn không nhớ nó đã được bảo quản thế nào, thì đừng tiếc. Ngăn đông giữ được thịt đang tươi, chứ không làm miếng thịt đã kém trở lại tươi được.</p>
<div class="quote"><p><strong>Câu hỏi cho bạn:</strong></p><ul><li>Nhà bạn thường mua thịt cá mấy ngày một lần, và cất vào ngăn đông theo từng túi nhỏ hay cả khối?</li><li>Bạn hay rã đông thịt bằng cách nào: để ngăn mát, ngâm nước, lò vi sóng hay để trên bàn bếp?</li><li>Có khi nào bạn rã cả khối thịt rồi cất lại phần thừa vào ngăn đông không?</li><li>Nếu mở ngăn đông ngay bây giờ, bạn có biết túi thịt nào đã nằm đó lâu nhất không?</li><li>Tuần này, bạn có thể thử chia thịt thành túi theo bữa và ghi ngày lên từng túi không?</li></ul></div>
<hr class="brk">
<h3 class="h2">PHẦN 3. NGĂN MÁT: RAU XANH VÀ ĐỒ ĂN THỪA</h3>
<p>Ngăn mát là nơi giữ đồ ăn trong vài ngày, không phải vài tuần. Hãy giữ nhiệt độ ngăn mát ở khoảng <strong>5 độ C hoặc thấp hơn</strong>, và đừng nhét tủ quá đầy, vì hơi lạnh cần có chỗ để lưu thông.</p>
<p><strong>Với đồ ăn đã nấu chín</strong>, thời gian là điều quan trọng nhất. Thức ăn để càng lâu ở nhiệt độ phòng càng nguy hiểm, vì đó chính là khoảng nhiệt độ vi khuẩn thích nhất. Khi bữa ăn xong, hãy để thức ăn nguội bớt rồi cất vào tủ lạnh sớm, <strong>không để ngoài quá 2 giờ</strong>. Chia thành hộp nhỏ có nắp đậy kín giúp thức ăn lạnh nhanh hơn và mỗi lần chỉ cần hâm đúng phần sẽ ăn. Đồ ăn thừa trong ngăn mát nên được <strong>dùng hết trong khoảng 2 ngày</strong>, đừng để quá lâu dù trông vẫn còn ngon.</p>
<p>Khi hâm lại, hãy đun thật kỹ cho thức ăn nóng đều tới tận bên trong, canh thì đun sôi lại, đừng chỉ hâm ấm sơ qua. Và chỉ hâm phần sẽ ăn, không hâm cả nồi rồi cất lại nhiều lần. Riêng thức ăn của trẻ nhỏ, bạn nên nấu vừa đủ cho từng bữa và <strong>không dùng lại</strong> phần con ăn thừa.</p>
<p><strong>Đồ sống và đồ chín nên ở riêng.</strong> Thịt cá sống đặt trong hộp kín hoặc bát có đĩa hứng, để nước từ thịt sống không nhỏ vào rau hay đồ ăn chín. Khi sơ chế, dùng riêng dao thớt cho đồ sống và đồ chín.</p>
<p><strong>Với rau củ</strong>, hãy để trong ngăn rau, tránh đè lên nhau cho khỏi dập nát. Rau lá mau héo nên ăn trước, củ quả như cà rốt, bí để được lâu hơn thì ăn sau. Rau đã bị úa, dập nhiều hay có mùi lạ thì không nên tiếc.</p>
<p>Một mẹo nhỏ giúp bạn khỏi phải nhớ: mỗi lần đi chợ về, xếp đồ mới vào phía trong, đẩy đồ cũ ra phía ngoài. Đồ nào vào trước thì ăn trước. Chỉ vậy thôi mà tủ lạnh nhà mình sẽ gọn gàng hơn, đồ ăn ít bị bỏ quên hơn, và cả nhà ăn an tâm hơn.</p>
<div class="quote"><p><strong>Câu hỏi cho bạn:</strong></p><ul><li>Sau bữa tối, thức ăn thừa nhà bạn thường nằm ngoài bàn bao lâu rồi mới được cất vào tủ lạnh?</li><li>Trong ngăn mát nhà bạn lúc này, có hộp đồ ăn nào đã để quá 2 ngày không?</li><li>Khi hâm lại đồ ăn, bạn hâm cả nồi hay chỉ hâm phần sẽ ăn?</li><li>Đồ sống và đồ chín trong tủ lạnh nhà bạn đã được để riêng chưa?</li><li>Nếu chỉ chọn một thói quen để bắt đầu trong tuần này: chia hộp nhỏ, ghi ngày, hay xếp đồ cũ ra ngoài, bạn chọn thói quen nào?</li></ul></div>

<p>Nếu bạn là người chăm lo cho gia đình từng bữa ăn, có lẽ bạn hiểu rất rõ cảm giác này. Sáng chưa kịp tỉnh hẳn đã nghĩ trưa nay nấu gì. Đi làm về còn mệt, vừa cất túi đã xắn tay vào bếp. Bạn nhớ con thích món gì, chồng hay ăn mặn hay nhạt, bố mẹ răng yếu cần món mềm hơn. Không ai giao cho bạn bản danh sách ấy, nhưng bạn vẫn thuộc lòng.</p>
<p>Rồi có những ngày bạn nấu ăn như một việc phải làm cho xong. Đứng trong bếp mà đầu vẫn lo chuyện công việc, tay thái rau mà lòng thấy trống. Nấu xong, dọn lên, cả nhà ăn vội, không ai nói gì, và bạn tự hỏi: <em>"Mình làm tất cả những điều này để làm gì?"</em></p>
<p>Thuỷ muốn nói với bạn điều này: mỗi bữa cơm bạn nấu chưa bao giờ chỉ là một phần việc nhà. Việc bạn chia thịt thành từng túi nhỏ, ghi ngày cẩn thận, chọn bó rau tươi nhất, cất phần canh ngon cho người về muộn, tất cả đều là những cách lặng lẽ để nói <em>"mình thương mọi người"</em>. Chiếc tủ lạnh được sắp xếp gọn gàng cũng là một cách chăm sóc gia đình, vì nó cho bạn thêm thời gian và bớt đi những lo lắng.</p>
<p><strong>Cảm xúc của người nấu cũng đi vào bữa ăn.</strong> Khi bạn nấu trong vội vã và bực bội, món ăn thường chỉ được làm cho xong. Khi bạn nấu với một chút thảnh thơi, bạn nêm nếm kỹ hơn, bày biện đẹp hơn, và chính bạn cũng thấy vui hơn khi dọn mâm.</p>
<p>Thuỷ muốn bạn nhớ thật kỹ điều này: <strong>khi bạn gieo niềm vui vào từng món ăn, cả nhà không chỉ được ăn ngon, mà còn được "ăn" cả cảm xúc của bạn.</strong> Một bát canh được nấu trong lúc bạn vừa làm vừa ngân nga sẽ mang theo sự dịu dàng ấy lên mâm. Nụ cười khi bạn gắp thức ăn cho con, giọng nói nhẹ nhàng khi gọi cả nhà vào ăn, tất cả đều trở thành một phần của bữa cơm. Ngược lại, một mâm cơm đầy đủ món nhưng được dọn lên với gương mặt mệt mỏi, cáu kỉnh, thì mọi người cũng ăn trong không khí nặng nề, dù món ăn có ngon đến đâu.</p>
<p>Trẻ con có thể không nhớ hôm ấy mẹ nấu món gì, nhưng sẽ nhớ rất lâu cảm giác được ngồi bên mâm cơm ấm áp. Người thân đi làm về mệt, chỉ cần thấy căn bếp sáng đèn và một người đang vui vẻ đợi mình, đã thấy lòng nhẹ đi. Bữa ăn nuôi cơ thể bằng chất dinh dưỡng, và nuôi tâm hồn bằng cảm xúc của người nấu.</p>
<p>Vì vậy, trước khi bắt tay vào bếp, bạn thử dành một phút cho chính mình: hít thở chậm vài hơi, bật một bản nhạc mình thích, nghĩ tới gương mặt của người sẽ ăn món này. Không cần phải mâm cao cỗ đầy. Một bát canh nóng, một đĩa rau xanh, một món cả nhà thích, được nấu bằng niềm vui và sự quan tâm, đã là một bữa ăn trọn vẹn.</p>
<p>Bạn có thể thử vài điều nhỏ để bữa ăn trở thành khoảng thời gian gắn kết:</p>
<ul><li><strong>Rủ cả nhà cùng vào bếp.</strong> Con nhặt rau, chồng rửa bát, mỗi người một việc nhỏ. Nấu ăn cùng nhau là lúc để trò chuyện, và để mọi người hiểu hơn công sức của người đứng bếp.</li><li><strong>Ngồi xuống ăn cùng nhau.</strong> Cất điện thoại, tắt ti vi, hỏi nhau một câu về ngày hôm nay. Bữa cơm là nơi cả nhà được ở gần nhau nhất trong ngày.</li><li><strong>Nói lời cảm ơn.</strong> Người ăn cảm ơn người nấu, và người nấu cũng cảm ơn khi được giúp đỡ. Một lời cảm ơn nhỏ làm bữa ăn ngon hơn rất nhiều.</li><li><strong>Cho phép mình không hoàn hảo.</strong> Có hôm bận quá, một bữa đơn giản với đồ đã chuẩn bị sẵn trong tủ lạnh cũng hoàn toàn ổn. Thương gia đình không có nghĩa là phải kiệt sức vì gia đình.</li></ul>
<p>Và đừng quên, người nấu cũng là một thành viên trong gia đình. Bạn chăm cho từng bữa ăn của mọi người, thì cũng hãy ngồi xuống ăn tử tế bữa của mình, đừng chỉ ăn vội phần còn thừa lại. Khi bạn khoẻ và vui, căn bếp nhà mình cũng sẽ ấm áp hơn.</p>
<div class="quote"><p><strong>Câu hỏi cho bạn:</strong></p><ul><li>Nếu bạn là người chăm lo cho gia đình từng bữa ăn, bạn thường nấu ăn với tâm trạng như thế nào: vui vẻ, vội vã hay mệt mỏi?</li><li>có khi nào bạn nấu ăn theo sở thích của mình mà quên đi những sở thích, nhu cầu của người thân không?</li><li>Lần gần nhất cả nhà cùng ngồi ăn, cất điện thoại và trò chuyện với nhau là khi nào?</li><li>Nếu cả nhà cùng vào bếp với bạn, bạn muốn  nói điều gì với họ? cảm xúc lúc đó của bạn thế nào ?</li><li>Đã bao giờ bạn dành hết tình yêu thương cho gia đình mà quên đi chăm sóc chính bản thân mình không?</li></ul></div>

<h3 class="h2">LỜI KẾT. CHĂM CHIẾC TỦ LẠNH CŨNG LÀ CHĂM BỮA ĂN CỦA CẢ NHÀ</h3>
<p>Bạn thân mến,</p>
<p>Chiếc tủ lạnh nằm lặng lẽ trong góc bếp, nhưng mỗi ngày nó giữ gìn rất nhiều thứ cho gia đình mình: miếng thịt cho bữa tối, bó rau cho bát canh, phần cơm để dành cho người về muộn.</p>
<p>Bảo quản thực phẩm đúng cách không đòi hỏi bạn phải có tủ lạnh đắt tiền hay thời gian rảnh rỗi. Chỉ cần vài việc nhỏ: chia thịt theo bữa, ghi ngày lên túi, rã đông ở ngăn mát, cất đồ ăn thừa sớm, và đồ nào vào trước thì ăn trước.</p>
<p>Mỗi lần bạn làm như vậy, bạn không chỉ giữ cho thức ăn tươi ngon hơn. Bạn đang giữ cho bữa ăn nhà mình đủ chất hơn, an toàn hơn, và bớt đi những lo lắng không cần thiết mỗi khi mở cửa tủ.</p>
<p>Và hơn tất cả, mỗi bữa cơm bạn chuẩn bị là tình yêu thương bạn dành cho gia đình. Mong rằng mỗi lần vào bếp, bạn sẽ thấy nhẹ lòng hơn một chút, vì bạn biết mình đang làm một việc thật ý nghĩa.</p>

  var pages=[], cur=0, builtFor='';
  function build(){
    var key=stage.clientWidth+'x'+stage.clientHeight; if(key===builtFor) return; builtFor=key;
    var keep = pages[cur] ? +pages[cur].getAttribute('data-first') : -1;
    stage.innerHTML=''; pages=[];
    stage.style.setProperty('--img-max', Math.round(Math.min(stage.clientHeight*0.45, stage.clientWidth*0.62))+'px');
    var c=document.createElement('div'); c.className='page cover'; c.setAttribute('data-first','-1');
    c.innerHTML='<img src="'+COVER+'" alt="Bìa" draggable="false">'; stage.appendChild(c); pages.push(c);
    var blocks=Array.prototype.slice.call(document.getElementById('content').content.children), page=null;
    function newPage(i){ page=document.createElement('div'); page.className='page on'; page.setAttribute('data-first',i); stage.appendChild(page); pages.push(page); }
    blocks.forEach(function(b,i){
      if(b.classList.contains('brk')){ if(page && page.children.length) page=null; return; }
      if(!page) newPage(i);
      var node=b.cloneNode(true); page.appendChild(node);
      if(page.scrollHeight>page.clientHeight+2 && page.children.length>1){
        page.removeChild(node);
        var carry=[], last=page.lastElementChild;
        while(last && (/^H[34]$/.test(last.tagName) || last.classList.contains('part'))){ page.removeChild(last); carry.unshift(last); last=page.lastElementChild; }
        newPage(i); carry.forEach(function(n){ page.appendChild(n); }); page.appendChild(node);
      }
    });
    cur=0; for(var k=0;k<pages.length;k++){ if(+pages[k].getAttribute('data-first')<=keep) cur=k; }
    show();
  }
  function show(){
    pages.forEach(function(p,i){ p.classList.toggle('on', i===cur); });
    prev.disabled=cur===0; next.disabled=cur===pages.length-1;
    count.textContent=(cur===0?'Bìa':'Trang '+cur)+' / '+(pages.length-1);
  }
  function go(d){ var n=cur+d; if(n<0||n>=pages.length) return; cur=n; show(); }
  prev.addEventListener('click',function(){ go(-1); });
  next.addEventListener('click',function(){ go(1); });
  document.addEventListener('keydown',function(e){

  var sx=null; stage.addEventListener('touchstart',function(e){ sx=e.touches[0].clientX; },{passive:true});
  stage.addEventListener('touchend',function(e){ if(sx===null) return; var dx=e.changedTouches[0].clientX-sx; if(Math.abs(dx)>50) go(dx<0?1:-1); sx=null; });

  document.addEventListener('copy',function(e){ e.preventDefault(); });
  document.addEventListener('dragstart',function(e){ e.preventDefault(); });
