<template id="content"><h3 class="h2">Lời mở đầu</h3>
<p>Bạn đã đọc rất nhiều lời khuyên về ăn uống. Ăn gì, kiêng gì, bao nhiêu là đủ.</p>
<p>Nhưng có một thứ bạn đưa vào cơ thể nhiều hơn mọi loại thực phẩm cộng lại, mỗi ngày, suốt đời — mà gần như chưa ai ngồi xuống dạy bạn cách dùng cho đúng.</p>
<p>Đó là nước.</p>
<p>Trong quá trình tư vấn, tôi nhận ra một điều lặp đi lặp lại: phần lớn mọi người <strong>không thiếu kiến thức về ăn, họ thiếu kiến thức về uống</strong>. Và điều đáng nói là — sửa cách uống nước rẻ hơn, dễ hơn và cho kết quả nhanh hơn rất nhiều so với việc đảo lộn cả thực đơn.</p>
<p>Bạn không phải bỏ món nào. Không phải mua gì. Không phải nấu khác đi.</p>
<p>Bạn chỉ cần uống nước theo một cách khác với cách bạn đang uống.</p>
<p>Cuốn ebook này đi qua bốn việc:</p>
<ol><li>Chỉ ra những chỗ bạn đang uống nước sai mà không biết.</li><li>Dạy bạn cách uống đúng — cụ thể tới mức tập được ngay hôm nay.</li><li>Chỉ cho bạn cách tự đánh giá mọi lời khuyên về nước mà bạn sẽ còn gặp.</li><li>Và nói với bạn một điều ít ai nói: vì sao cách bạn sống, cách bạn cảm, lại hiện lên rất rõ trên chính cơ thể mà phần lớn được làm từ nước này.</li></ol>
<p>Đọc hết mất khoảng hai mươi phút. Áp dụng thì bắt đầu được ngay từ cốc nước tiếp theo.</p>
<p>Chúc bạn khoẻ.</p>
<p><strong>Thanh Thuỷ</strong></p>
<hr class="brk"><div class="part">PHẦN I — VÌ SAO CÁCH BẠN ĐANG UỐNG LÀ CHƯA ĐỦ</div>
<h3 class="h2">Chương 1: Khát không phải là lúc bắt đầu thiếu nước</h3>
<p>Hãy bắt đầu bằng một câu hỏi thật đơn giản:</p>
<p><strong>Bạn uống nước khi nào?</strong></p>
<p>Nếu câu trả lời là <em>"khi nào khát thì uống"</em> — bạn đang ở cùng nhóm với phần lớn người Việt. Và đó chính là chỗ cần sửa đầu tiên.</p>
<h4 class="h3">Cơ thể bạn chỉ có một chỗ biết kêu</h4>
<p>Mọi bộ phận trong cơ thể bạn đều cần nước. Thận cần. Gan cần. Máu cần. Khớp cần. Da cần. Từng tế bào một đều cần.</p>
<p>Nhưng khi thiếu nước, chúng <strong>không thiếu cùng một lúc</strong> — chúng thiếu lần lượt.</p>
<p>Và đây là điều quan trọng: trong tất cả những bộ phận đó, <strong>chỉ có não bộ là phát ra được tín hiệu</strong>. Thận thiếu nước, nó không kêu. Gan thiếu nước, nó không kêu. Mạch máu đặc lại, nó cũng không kêu.</p>
<p>Chỉ đến khi não bộ thiếu nước, nó mới báo xuống miệng, và bạn mới thấy khát.</p>
<h4 class="h3">Vấn đề nằm ở thứ tự</h4>
<p>Não bộ <strong>không phải là bộ phận thiếu nước đầu tiên</strong>.</p>
<p>Nghĩa là khi bạn thấy khát, một phần đáng kể cơ thể bạn đã hoạt động trong tình trạng thiếu nước từ trước đó — có thể đã khá lâu.</p>
<p>Cảm giác khát không phải là chuông báo cháy đặt ở cửa. Nó là chuông báo cháy đặt ở tầng trên cùng. Khi nó kêu, lửa đã cháy được một lúc ở tầng dưới rồi.</p>
<div class="quote"><p><strong>Khát là tín hiệu báo muộn, không phải thời điểm bắt đầu.</strong></p></div>

<h4 class="h3">Hệ quả không đến ngay, nhưng nó đến</h4>
<p>Hãy nói rõ để bạn không hoang mang: uống nước theo cảm giác khát <strong>không khiến bạn đổ bệnh ngay ngày mai</strong>. Không có chuyện đó.</p>
<p>Nhưng cơ thể bạn hoạt động không nghỉ — cả lúc bạn ngủ. Nếu ở phần lớn thời gian trong ngày, một phần cơ thể luôn phải làm việc trong điều kiện thiếu nước, thì mọi hoạt động đều trở nên nặng nhọc hơn một chút.</p>
<p>Một chút, nhân với mỗi ngày, nhân với nhiều năm.</p>
<p>Điều bạn cảm nhận được sẽ không phải là một cơn bệnh. Nó là:</p>
<ul><li>Da khô hơn, xỉn hơn, dễ nứt nẻ.</li><li>Người uể oải, thiếu sức sống, không có năng lượng để làm việc tử tế cả ngày.</li><li>Ngủ chập chờn.</li><li>Táo bón, tiêu hoá ì ạch.</li><li>Khớp kêu, vận động kém trơn tru.</li></ul>
<p>Những thứ này bạn thường đổ cho tuổi tác, cho công việc, cho thời tiết. Đôi khi chúng chỉ đơn giản là cơ thể đang khát mà không biết cách nói với bạn.</p>
<h4 class="h3">Điều cần rút ra</h4>
<p>Uống nước phải là <strong>một thói quen theo lịch</strong>, không phải một phản ứng theo cảm giác.</p>
<p>Cũng giống như bạn không đợi đến khi đói lả mới ăn, không đợi đến khi kiệt sức mới ngủ. Bạn ăn theo bữa. Bạn ngủ theo giờ.</p>
<p>Nước cũng vậy.</p>
<hr class="brk">
<h3 class="h2">Chương 2: Nước làm gì trong cơ thể bạn</h3>
<p>Trước khi nói cách uống, cần hiểu bạn đang uống để làm gì. Vì hiểu rồi thì mới chịu làm.</p>
<h4 class="h3">Bạn phần lớn là nước</h4>
<p>Hãy dừng lại ở đây một chút.</p>
<p>Nếu cân toàn bộ cơ thể bạn lên, thì khoảng <strong>sáu đến bảy phần mười trọng lượng ấy là nước</strong>. Tỉ lệ thay đổi theo tuổi, theo giới, theo lượng cơ và mỡ của mỗi người — nhưng con số chung thì luôn nằm quanh đó.</p>
<p>Nghĩa là gì?</p>
<p>Nghĩa là khi bạn soi gương và nhìn thấy chính mình, phần lớn cái bạn đang nhìn không phải là xương, không phải là thịt. Nó là nước.</p>
<p>Nước trong máu. Nước trong từng tế bào. Nước trong dịch khớp, trong dịch tiêu hoá, trong nước mắt, trong lớp ẩm giữ cho làn da bạn căng và mềm. Não bộ — thứ đang đọc những dòng này — cũng phần lớn là nước.</p>
<p>Chúng ta quen nghĩ về nước như một thứ ở bên ngoài: một cốc nước, một chai nước, thứ ta rót vào người rồi thải ra.</p>
<p>Nhưng sự thật ngược lại. <strong>Nước không phải là thứ bạn dùng. Nước là thứ bạn được làm ra từ đó.</strong></p>
<p>Khi bạn hiểu điều này, câu hỏi "hôm nay mình uống đủ chưa" bỗng mang một trọng lượng khác hẳn.</p>
<h4 class="h3">Ba việc quan trọng nhất nước làm</h4>
<p><strong>Một — làm máu loãng và lưu thông.</strong> Máu càng đủ nước càng dễ chảy, càng dễ mang oxy và dưỡng chất đến từng ngóc ngách. Máu thiếu nước thì đặc lại và di chuyển khó khăn hơn.</p>
<p><strong>Hai — đưa chất thải ra ngoài.</strong> Thận mỗi ngày lọc một lượng máu rất lớn để giữ cơ thể bạn sạch. Nó cần nước để làm việc đó. Không đủ nước, phần việc dọn dẹp bị chậm lại.</p>
<p><strong>Ba — tham gia vào phản ứng chuyển hoá.</strong> Đây là phần ít người biết nhất, và cũng là lý do vì sao <strong>uống đủ lượng vẫn có thể chưa đủ</strong>. Nước cần được <strong>giữ lại trong cơ thể đủ lâu</strong> để tham gia vào các phản ứng bên trong, rồi mới được thải ra.</p>
<p>Nếu nước vào rồi ra quá nhanh, nó chỉ đi ngang qua bạn. Nó không kịp làm việc gì cả.</p>
<h4 class="h3">Đây là chỗ mọi thứ bắt đầu thú vị</h4>
<p>Rất nhiều người nói với tôi: <em>"Em uống đủ nước mà, ngày mấy chai, nhưng em vẫn khô da, vẫn mệt, vẫn đi vệ sinh suốt."</em></p>
<p>Họ không nói dối. Họ uống đủ thật.</p>
<p>Nhưng họ uống theo cách khiến nước <strong>không ở lại</strong>.</p>
<p>Và đó chính là toàn bộ nội dung của cuốn ebook này: <strong>uống đủ chưa chắc đã là uống đúng.</strong></p>
<p>Lượng chỉ là một nửa câu chuyện. Nửa còn lại là <strong>cách</strong> và <strong>thời điểm</strong> — hai thứ gần như không ai nhắc tới.</p>
<hr class="brk"><div class="part">PHẦN II — SÁU CHỖ HẦU HẾT MỌI NGƯỜI ĐANG LÀM SAI</div>
<h3 class="h2">Chương 3: Sai lầm 1 — Khát mới uống</h3>
<p>Chương 1 đã nói kỹ về cái sai này rồi, nên ở đây tôi chỉ nói về <strong>cách sửa</strong>.</p>
<h4 class="h3">Vì sao khó sửa</h4>
<p>Vì bạn không có lý do nào để nhớ. Cơn khát là lời nhắc duy nhất bạn có, và nó đến muộn.</p>
<p>Nên cách sửa không phải là "cố nhớ uống nước nhiều hơn". Cách sửa là <strong>gắn việc uống nước vào những việc bạn chắc chắn sẽ làm</strong>.</p>
<h4 class="h3">Cách sửa</h4>
<p>Đừng đặt mục tiêu "hôm nay uống nhiều nước hơn". Mục tiêu đó không có hình thù, và bạn sẽ quên trước giờ trưa.</p>
<p>Thay vào đó, hãy neo cốc nước vào những mốc cố định trong ngày bạn không thể quên: lúc vừa mở mắt, trước mỗi bữa ăn, trước khi đi tắm, trước khi lên giường.</p>
<p>Bốn mốc này là xương sống của cả cuốn sách. Chương 10 sẽ nói kỹ vì sao lại là bốn mốc đó và mỗi mốc có tác dụng gì.</p>
<p>Điều cần nhớ lúc này chỉ là: <strong>bạn cần một cái lịch, không cần một cảm giác.</strong></p>
<hr class="brk">
<h3 class="h2">Chương 4: Sai lầm 2 — Uống ừng ực</h3>
<p>Đây là sai lầm phổ biến thứ hai, và cũng là sai lầm tôi thấy nhiều người bất ngờ nhất khi nghe.</p>
<h4 class="h3">Vì sao ta hay uống ừng ực</h4>
<p>Vì ta chỉ uống khi đã quá khát.</p>
<p>Khi bản năng sinh tồn trỗi dậy thì lý trí mờ đi. Bạn không còn đủ bình tĩnh để nhấp từng ngụm. Bạn cầm cốc lên và tu một hơi.</p>
<p>Nghĩa là sai lầm số 2 <strong>là hậu quả trực tiếp của sai lầm số 1</strong>. Sửa được cái đầu thì cái thứ hai tự nhẹ đi.</p>
<h4 class="h3">Chuyện gì xảy ra khi nước vào quá nhanh</h4>
<p>Bạn có bao giờ uống nước nhanh xong thấy hơi tức ngực, tim đập nhanh, khó chịu chưa?</p>
<p>Đó không phải tưởng tượng.</p>
<p>Nước vào cơ thể làm <strong>thể tích tuần hoàn tăng lên</strong> — giống như rót nước vào cốc, mực nước dâng. Nếu nó dâng từ từ, cơ thể thích nghi kịp. Nếu nó dâng đột ngột, cơ thể phải phản ứng gấp: tim đập nhanh hơn, huyết áp nhích lên, người nóng hơn.</p>
<p>Cơ thể bạn thích sự <strong>chậm rãi và ổn định</strong>. Nó không thích những cú thay đổi đột ngột — ở bất cứ chuyện gì.</p>
<h4 class="h3">Và đây mới là phần thiệt hại thật</h4>
<p>Khi nước vào quá nhanh, não bộ nhận ra có gì đó bất thường. Nó phản ứng bằng cách <strong>cho thận thải nước ra thật nhanh</strong> để đưa mọi thứ về ổn định.</p>
<p>Kết quả:</p>
<div class="quote"><p><strong>Uống càng nhanh → đi tiểu càng nhanh → nước ở lại trong cơ thể càng ít.</strong></p></div>
<p>Đây chính là lời giải cho câu chuyện ở chương 2. Người uống đủ lượng mà vẫn thiếu nước, thường là người <strong>uống dồn</strong>. Nước của họ vào rồi ra, không kịp làm việc gì.</p>
<p>Bạn tự kiểm tra được ngay: nếu bạn uống nước xong là muốn đi vệ sinh gần như lập tức, và ngày nào cũng vậy, thì nhiều khả năng bạn không uống thiếu — bạn uống sai.</p>
<p>Ngược lại, khi bạn uống chậm rãi, thể tích tuần hoàn tăng từ từ, nhịp tim ổn định, não bộ không thấy có vấn đề gì. Nó để mọi thứ diễn ra tự nhiên: nước vào, làm xong việc của nó, rồi mới được thải ra.</p>
<h4 class="h3">Cách sửa</h4>
<p>Chương 9 sẽ hướng dẫn chi tiết kỹ thuật. Nguyên tắc thì chỉ có một câu:</p>
<p><strong>Uống một cốc nước chậm hơn bạn đang làm hôm nay vài chục giây. Chỉ vậy thôi.</strong></p>
<hr class="brk">
<h3 class="h2">Chương 5: Sai lầm 3 — Uống ngay trong bữa ăn</h3>
<p>Bữa cơm Việt gần như luôn có một bát canh. Và bên cạnh nhiều người còn có thêm một cốc nước.</p>
<p>Đây là thói quen ăn sâu nhất, và cũng là thói quen khó thuyết phục người ta bỏ nhất.</p>
<h4 class="h3">Chuyện gì xảy ra trong dạ dày</h4>
<p>Dạ dày tiết ra <strong>dịch vị</strong> để trộn vào thức ăn. Nhờ dịch vị mà thức ăn được phân rã, tiêu hoá, rồi dưỡng chất mới đi vào ruột non được.</p>
<p>Dịch vị ở trạng thái hơi sệt thì mới làm tốt việc của nó.</p>
<p>Khi bạn uống nước ngay trước, ngay trong hoặc ngay sau bữa ăn — nước lọc, nước ngọt, nước canh, tất cả — dịch vị <strong>bị hoà loãng ra</strong>. Loãng rồi thì khả năng trộn lẫn và phân rã thức ăn giảm đi đáng kể.</p>
<p>Hệ quả bạn cảm nhận được: khó tiêu, chướng bụng, đầy hơi, ợ, bụng nặng nề sau bữa ăn.</p>
<p>Nếu dạ dày bạn khoẻ, có thể bạn chưa thấy gì. Nhưng nếu bạn thuộc nhóm hay đầy bụng, ăn xong là mệt — thì đây là chỗ đầu tiên nên sửa, trước cả khi nghĩ đến chuyện đổi món.</p>
<h4 class="h3">Vậy uống lúc nào?</h4>
<p>Đây là phần hay nhất, và cũng là phần ít người biết:</p>
<div class="quote"><p><strong>Một cốc nước uống trước bữa ăn khoảng nửa tiếng đến một tiếng thì không những không hại — nó còn có lợi.</strong></p></div>
<p>Nước giúp dạ dày co bóp mạnh hơn. Dạ dày co bóp càng mạnh thì dịch vị tiết ra càng nhiều. Nên nếu bạn cấp nước trước bữa ăn một khoảng đủ xa, thì đến đúng giờ ăn, dạ dày bạn đã sẵn sàng với lượng dịch vị dồi dào hơn.</p>
<p>Ăn xong dễ chịu hơn. Ít đầy bụng hơn. Hấp thu tốt hơn.</p>
<p>Cùng một cốc nước. Chỉ khác thời điểm. Một bên phá, một bên giúp.</p>
<h4 class="h3">Còn bát canh thì sao?</h4>
<p>Tôi không bắt bạn bỏ canh. Không cần cực đoan tới mức không cho một giọt nước nào vào miệng trong bữa ăn.</p>
<p>Nhưng hãy để ý ba điều:</p>
<p><strong>Một — lượng.</strong> Húp vài thìa canh trong bữa là chuyện bình thường. Uống cả một cốc nước lớn trong lúc ăn thì là chuyện khác hẳn.</p>
<p><strong>Hai — canh là đường dẫn gia vị.</strong> Đây là điều gần như không ai để ý. Để nấu một nồi canh, bạn cho vào đó nước mắm, hạt nêm, đường, bột ngọt. Nếu bày riêng chỗ gia vị đó ra đĩa, bạn sẽ không ăn nổi. Nhưng hoà loãng vào một nồi nước ngọt lành, bạn húp hết cả bát mà không thấy gì.</p>
<p>Nhiều gia đình cắt muối trong món mặn rất kỹ, rồi để toàn bộ lượng muối ấy quay lại qua bát canh.</p>
<p><strong>Ba — canh làm bạn lười nhai.</strong> Có canh thì cơm dễ trôi và bạn nuốt vội.</p>
<p>Và chuyện nhai lại quan trọng hơn bạn nghĩ.</p>
<h4 class="h3">Vì sao nhai kỹ lại quan trọng</h4>
<p>Để một miếng thức ăn tiêu hoá được, nó phải được nghiền nhuyễn. Có đúng hai bộ phận làm việc đó: <strong>răng</strong> và <strong>dạ dày</strong>.</p>
<p>Bộ phận nào lười, bộ phận kia gánh.</p>
<p>Răng của bạn chắc hơn dạ dày rất nhiều. Nhai kỹ tức là bạn để răng làm phần việc mà nó vốn sinh ra để làm, và giảm tải cho dạ dày. Nuốt vội tức là bạn ném toàn bộ phần việc đó xuống một cơ quan mềm hơn, và bắt nó làm cật lực suốt đời.</p>
<p>Thêm một điều nữa: từ lúc thức ăn xuống dạ dày đến lúc não bộ nhận ra bạn đã no, cần một khoảng thời gian nhất định. Ăn quá nhanh nghĩa là <strong>bạn ăn xong trước khi não kịp biết là đủ rồi</strong>. Đó là lý do có những bữa bạn dừng lúc thấy vừa, rồi mười phút sau mới thấy no tức bụng.</p>
<p>Nếu bạn đang muốn giảm cân hoặc không muốn tăng cân, thì ăn chậm là can thiệp rẻ nhất bạn có. Bạn không phải bỏ món nào cả.</p>
<h4 class="h3">Cách sửa</h4>
<ul><li>Cốc nước chuyển về <strong>trước bữa ăn khoảng nửa tiếng đến một tiếng</strong>.</li><li>Trong bữa: húp canh vừa phải, đừng thay bằng cốc nước lớn.</li><li>Nếu chan canh vào cơm, hãy nhai thật kỹ trước khi nuốt. Tốt hơn nữa là ăn cơm riêng, húp canh riêng.</li><li>Tập ăn chậm lại một chút mỗi bữa. Một miếng cơm trước đây bạn nhai vài lần thì nay nhai gấp đôi. Chỉ cần vài phút nhiều hơn cho cả bữa.</li></ul>
<h4 class="h3">Còn nếu không có nước là bạn không nuốt nổi?</h4>
<p>Nhiều người nói: <em>"Không có canh em không nuốt được cơm."</em></p>
<p>Điều này thường không phải do bữa ăn khô. Nó là do <strong>cơ thể bạn vốn đã thiếu nước từ trước</strong> — và đến bữa cơm, khi phải xử lý tinh bột và đạm, tình trạng thiếu ấy bộc lộ ra rõ nhất.</p>
<p>Đây là một cái vòng: thiếu nước → phải uống trong bữa → dịch vị loãng → tiêu hoá kém → khó chịu.</p>
<p>Cách ra khỏi vòng không phải là cố nhịn nước trong bữa. Mà là <strong>cấp đủ nước cho cơ thể ở những thời điểm khác trong ngày</strong>. Sau một thời gian ngắn làm đúng, bạn sẽ ngạc nhiên khi thấy mình ngồi ăn mà không còn thấy khát nữa.</p>
<hr class="brk">
<h3 class="h2">Chương 6: Sai lầm 4 — Thiếu cả ngày nhưng thừa một lúc</h3>
<p>Đây là điều nghe có vẻ mâu thuẫn, nhưng lại là chân dung chính xác của rất nhiều người Việt.</p>
<h4 class="h3">Hai vấn đề khác nhau</h4>
<p>Có hai câu hỏi hoàn toàn khác nhau mà mọi người hay gộp làm một:</p>
<ol><li><strong>Cả ngày bạn có uống đủ không?</strong></li><li><strong>Mỗi lần bạn uống có vừa phải không?</strong></li></ol>
<p>Người Việt phần lớn trả lời "không" cho câu một — tổng lượng cả ngày thiếu.</p>
<p>Nhưng đồng thời cũng trả lời "không" cho câu hai — vì khi đã khát, họ cầm nguyên một chai lớn và uống cạn một hơi.</p>
<p>Kết quả là một tình trạng kỳ lạ: <strong>thiếu nước xét cả ngày, nhưng thừa nước tại một thời điểm.</strong></p>
<h4 class="h3">Vì sao thừa nước một lúc lại là vấn đề</h4>
<p>Cơ thể có giới hạn trong việc xử lý một lượng nước lớn đổ vào cùng lúc. Vượt quá giới hạn đó, phản ứng đầu tiên là tống nước ra thật nhanh — nghĩa là bạn vừa mất công uống, vừa không giữ lại được gì.</p>
<p>Ở mức cực đoan, việc nạp một lượng nước rất lớn trong thời gian rất ngắn thực sự nguy hiểm. Đã có những trường hợp ngộ độc nước được ghi nhận trên thế giới. Chuyện này hiếm, và tôi không nói ra để doạ bạn — chỉ để bạn hiểu rằng "nước thì uống bao nhiêu cũng được" là một niềm tin sai.</p>
<p>Có một trần lượng hợp lý cho mỗi lần uống, khác nhau giữa nam, nữ và trẻ em. Con số cụ thể tôi sẽ đưa cho bạn khi làm việc trực tiếp, vì nó cần đặt cạnh cân nặng và tình trạng của riêng bạn. Còn nguyên tắc thì đơn giản:</p>
<div class="quote"><p><strong>Đừng bao giờ dốc cạn một chai lớn trong một lần.</strong></p></div>
<h4 class="h3">Cách sửa</h4>
<p><strong>Rải đều.</strong> Đây là toàn bộ lời khuyên.</p>
<p>Lấy lượng nước cả ngày của bạn, chia ra nhiều lần trong ngày, mỗi lần một cốc vừa phải. Đừng dồn.</p>
<p>Một mẹo nhỏ có hiệu quả bất ngờ: <strong>đổi cái chai của bạn lấy một cái cốc.</strong> Chai lớn khiến bạn tu. Cốc khiến bạn phải đứng dậy rót lại — và chính lần đứng dậy đó là cái nhịp nghỉ giữ cho bạn không uống dồn.</p>
<h4 class="h3">Và một điều nữa: ban ngày nhiều hơn ban đêm</h4>
<p>Phần lớn lượng nước trong ngày nên được uống <strong>từ sáng đến chiều tối</strong>. Phần nhỏ còn lại rải vào buổi tối, và nên kết thúc trước giờ ngủ một khoảng.</p>
<p>Uống sát giờ ngủ khiến bạn phải dậy đi vệ sinh giữa đêm, và giấc ngủ bị cắt vụn. Nhưng nhịn hẳn nước buổi tối cũng không đúng — cơ thể bạn vẫn hoạt động suốt đêm và vẫn cần nước để làm việc đó.</p>
<p>Điểm cân bằng nằm ở chỗ: <strong>uống trước giờ đi ngủ một khoảng đủ để bạn kịp đi vệ sinh, rồi mới lên giường.</strong></p>
<hr class="brk">
<h3 class="h2">Chương 7: Sai lầm 5 — Lấy nước có vị thay nước lọc</h3>
<p>Khát thì phải uống gì đó. Và ngày nay "gì đó" có quá nhiều lựa chọn: nước ngọt, nước có ga, nước ép, sinh tố, trà đóng chai, nước trái cây, bia.</p>
<p>Chúng ngon. Nước lọc thì nhạt.</p>
<p>Nên rất nhiều người — đặc biệt là người trẻ và trẻ con — gần như không còn uống nước lọc nữa.</p>
<h4 class="h3">Nguyên tắc để phân biệt</h4>
<p>Đây là nguyên tắc rõ ràng nhất tôi có thể trao cho bạn, và tôi mong bạn nhớ nó suốt đời:</p>
<div class="quote"><p><strong>Nước thì không có calo. Cái gì có calo thì đó là đồ ăn, không phải nước.</strong></p></div>
<p>Nước lọc không cung cấp năng lượng cho cơ thể. Nó không được tính là thức ăn.</p>
<p>Nhưng nước ép, sinh tố, nước ngọt, nước đóng chai có vị, trà sữa — tất cả đều mang năng lượng vào người bạn. Nên chúng phải được <strong>tính vào phần ăn trong ngày của bạn</strong>, không được tính vào phần nước.</p>
<p>Đây là chỗ khiến rất nhiều người giảm cân mãi không xuống. Họ đếm rất kỹ từng miếng cơm, rồi uống mấy lon nước ngọt và không tính gì cả. Một lon nước ngọt mang vào người bạn một lượng năng lượng không hề nhỏ. Khác biệt là bạn có thể không ăn nổi hai bữa liền, nhưng uống hai lon thì rất dễ.</p>
<h4 class="h3">Giải khát không đồng nghĩa với cấp nước</h4>
<p>Uống một cốc nước ngọt lạnh, uống nước dừa, uống mấy cốc bia mùa hè — bạn thấy đã khát ngay.</p>
<p>Nhưng cảm giác hết khát và việc tế bào của bạn được cấp nước <strong>không phải là một</strong>. Bạn có thể vừa thấy rất đã, vừa đang thiếu nước.</p>
<p>Không có thứ gì thay thế được nước lọc trong việc làm cái việc mà nước lọc làm.</p>
<h4 class="h3">Với trẻ con thì đây là chuyện lớn</h4>
<p>Người lớn có ý thức sức khoẻ thì còn tự điều chỉnh được. Trẻ con thì không.</p>
<p>Một đứa trẻ lớn lên với nước ngọt, nước ép đóng hộp và các loại nước có vị sẽ hình thành một cái lưỡi quen ngọt. Sau này cho trẻ uống nước lọc, trẻ sẽ thấy nhạt nhẽo và khó uống .</p>
<p>Thói quen uống nước là thứ nên dạy sớm. Cùng với thói quen ăn chậm và nhai kỹ.</p>
<h4 class="h3">Cách sửa</h4>
<ul><li>Nước lọc là mặc định. Mọi thứ khác là ngoại lệ, và ngoại lệ thì phải tính vào phần ăn.</li><li>Không dùng nước có vị để giải khát theo phản xạ. Khát thì uống nước.</li><li>Không dùng bia rượu thay nước, dù mùa hè nó có "đã" đến đâu.</li><li>Với trẻ trong nhà: hạn chế tối đa nước đóng hộp, nước ép đóng chai và nước giải khát. Càng muộn càng tốt.</li></ul>
<hr class="brk">
<h3 class="h2">Chương 8: Sai lầm 6 — Uống nước quá lạnh</h3>
<p>Sai lầm cuối cùng nhẹ hơn năm cái trên, nhưng đáng nói — nhất là với những người dùng giọng nói để làm việc.</p>
<h4 class="h3">Vấn đề là sự thay đổi nhiệt đột ngột</h4>
<p>Cổ họng bạn không thích những cú sốc nhiệt.</p>
<p>Nước đá lạnh buốt, đồ lẩu nóng bỏng, kem, nước ngọt đầy đá uống liên tục — tất cả đều bắt niêm mạc họng chịu những biến động nhiệt vượt quá mức bình thường, ngày này qua ngày khác.</p>
<p>Nếu bạn là người phải nói nhiều — giảng dạy, tư vấn, bán hàng, livestream — thì giọng nói là công cụ làm việc của bạn, và nó đáng được bảo vệ như bất kỳ công cụ nào khác.</p>
<h4 class="h3">Nhiệt độ nên uống</h4>
<p>Nguyên tắc chung: <strong>nước mát vừa hoặc ấm vừa, không ở hai đầu cực đoan.</strong></p>
<p>Nước để ngăn mát tủ lạnh là được. Bỏ vài viên đá cho hơi mát cũng được. Nhưng một cốc nước đầy đá lạnh buốt thì không.</p>
<p>Với đồ nóng cũng vậy — lẩu, canh, cháo thì để nguội bớt rồi hãy ăn.</p>
<p>Riêng buổi sáng vừa ngủ dậy, hoặc những ngày trời lạnh, một cốc <strong>nước ấm</strong> là lựa chọn tốt hơn hẳn nước lạnh. Nó giúp cơ thể ấm lên và bắt đầu ngày làm việc dễ dàng hơn.</p>
<hr class="brk"><div class="part">PHẦN III — UỐNG NƯỚC ĐÚNG CÁCH</div>
<h3 class="h2">Chương 9: Kỹ thuật "nhai nước"</h3>
<p>Đây là chương quan trọng nhất của cuốn sách.</p>
<p>Nếu bạn chỉ nhớ được một điều duy nhất từ tất cả những gì đã đọc, hãy nhớ chương này.</p>
<h4 class="h3">Vì sao gọi là "nhai nước"</h4>
<p>Vì bạn sẽ uống nước theo cách gần giống như đang nhai một miếng thức ăn — chậm, chia nhỏ, có ngậm lại trước khi nuốt.</p>
<p>Nghe hơi buồn cười. Nhưng đây chính là thứ tạo ra khác biệt giữa <strong>uống đủ</strong> và <strong>uống có tác dụng</strong>.</p>
<p>Mục đích của kỹ thuật này chỉ có một: <strong>giữ nước ở lại trong cơ thể lâu nhất có thể</strong>, để nó kịp làm hết việc của mình trước khi bị thải ra.</p>
<h4 class="h3">Năm quy tắc</h4>
<p><strong>1. Ngồi xuống, đừng đứng.</strong> Đây là quy tắc dễ nhất và cũng hiệu quả bất ngờ. Khi bạn đứng, đặc biệt là đứng cạnh bình nước ở chỗ làm, bạn có xu hướng tu cho nhanh rồi đi. Khi bạn ngồi, tự khắc bạn uống chậm hơn và nước xuống thực quản từ tốn hơn.</p>
<p><strong>2. Ngụm nhỏ.</strong> Đừng ngửa cổ tu cả cốc. Mỗi lần một ngụm vừa miệng thôi.</p>
<p><strong>3. Ngậm lại vài giây trước khi nuốt.</strong> Đảo nước qua lại trong miệng vài lần. Cảm nhận nó ấm lên một chút, hoà với nước bọt một chút, rồi mới nuốt.</p>
<p>Phần này có một lợi ích phụ mà nhiều người quý: nó giúp khoang miệng bạn được cấp ẩm đều, nên bạn ít bị khô miệng khi ăn, khi nói, khi thuyết trình. Người hay khô miệng, khó tiết nước bọt sẽ thấy khác biệt sớm.</p>
<p><strong>4. Chia một ngụm thành vài lần nuốt.</strong> Đây là phần "nhai". Thay vì nuốt một cái ực, bạn nuốt từng phần nhỏ.</p>
<p><strong>5. Một cốc nước uống trong khoảng một phút.</strong> Thay vì mười giây như bạn vẫn làm.</p>
<h4 class="h3">Trả lời câu hỏi ai cũng hỏi</h4>
<p><em>"Uống kiểu này mất thời gian lắm."</em></p>
<p>Hãy làm phép tính cho rõ.</p>
<p>Bạn đang uống một cốc nước hết khoảng mười giây. Tôi đề nghị bạn uống trong khoảng một phút. Chênh lệch là chưa tới một phút cho mỗi cốc.</p>
<p>Cả ngày bạn uống chừng bảy tám cốc. Tổng cộng bạn "mất" khoảng <strong>năm đến bảy phút cho cả ngày</strong>.</p>
<p>Đổi lại: nước ở lại trong cơ thể, da đỡ khô, người đỡ mệt, đi vệ sinh ổn định hơn, tiêu hoá nhẹ hơn.</p>
<p>Năm phút. Tôi nghĩ đó là món hời nhất trong toàn bộ việc chăm sóc sức khoẻ.</p>
<h4 class="h3">Cùng với đó: đừng uống quá nhiều trong một lần</h4>
<p>Kỹ thuật nhai nước đi kèm một trần lượng cho mỗi lần uống — khác nhau giữa nam, nữ và trẻ em. Nguyên tắc là <strong>một cốc vừa phải, không phải cả chai</strong>.</p>
<p>Nếu bạn cần con số chính xác cho riêng mình, đó là phần tôi làm trong buổi tư vấn, vì nó phụ thuộc vào cân nặng và tình trạng cụ thể của bạn.</p>
<h4 class="h3">Tập thế nào</h4>
<p>Đừng cố làm cả năm quy tắc cùng lúc. Bạn sẽ bỏ cuộc trong hai ngày.</p>
<p>Tuần đầu chỉ làm <strong>quy tắc 1 và 2</strong>: ngồi xuống, ngụm nhỏ. Hai thứ này gần như không đòi hỏi nỗ lực gì.</p>
<p>Tuần thứ hai thêm <strong>quy tắc 3</strong>: ngậm vài giây rồi mới nuốt.</p>
<p>Đến khi ba cái đó thành phản xạ thì bốn với năm tự đến, vì lúc đó bạn đã uống chậm sẵn rồi.</p>
<hr class="brk">
<h3 class="h2">Chương 10: Bốn thời điểm vàng trong ngày</h3>
<p>Bạn đã biết uống thế nào. Giờ là uống khi nào.</p>
<p>Trong cả ngày, có bốn thời điểm mà một cốc nước có giá trị cao hơn hẳn những lúc khác. Đây là bộ khung tôi giao cho hầu hết khách hàng của mình.</p>
<h4 class="h3">Thời điểm 1 — Ngay khi vừa ngủ dậy</h4>
<p><strong>Đây là cốc nước quan trọng nhất trong ngày.</strong></p>
<p>Bạn vừa trải qua một đêm dài không uống một giọt nào, trong khi cơ thể vẫn hoạt động và vẫn mất nước qua hơi thở, qua da. Buổi sáng vừa dậy là lúc cơ thể bạn thiếu nước nhất trong cả chu kỳ một ngày.</p>
<p>Máu lúc này đặc hơn. Đặc thì lưu thông khó hơn.</p>
<p>Vậy mà phần lớn mọi người vừa mở mắt là bật dậy, lao vào nhà tắm, vào bếp, vào công việc — và tiếp tục để cơ thể chạy trong tình trạng khô suốt buổi sáng.</p>
<p><strong>Cách làm:</strong> đặt sẵn một cốc nước hoặc bình nhỏ cạnh giường từ tối hôm trước. Sáng dậy, <strong>uống chậm rãi trước khi đặt chân xuống đất</strong>. Xong rồi mới đi vệ sinh, đánh răng, tập thể dục, nấu ăn.</p>
<p>Trời lạnh thì dùng nước ấm. Không có nước ấm thì nước thường cũng được — quan trọng là có uống.</p>
<p>Riêng với người lớn tuổi trong nhà — bố mẹ, ông bà — đây là thói quen tôi mong bạn giúp họ thiết lập trước tiên. Nó dễ, nó miễn phí, và với nhóm tuổi đó nó đáng giá hơn nhiều thứ khác bạn có thể mua cho họ.</p>
<h4 class="h3">Thời điểm 2 — Trước bữa ăn khoảng nửa tiếng đến một tiếng</h4>
<p>Chương 5 đã giải thích: cốc nước này giúp dạ dày co bóp tốt hơn và tiết dịch vị dồi dào hơn, để đến giờ ăn bạn tiêu hoá nhẹ nhàng hơn.</p>
<p>Với người đang giảm cân, cốc nước này còn có tác dụng thứ hai: nó giúp bạn <strong>phân biệt được đói thật và thèm ăn</strong>.</p>
<p>Rất nhiều cơn "đói" giữa buổi thật ra chỉ là cơ thể đang cần nước. Uống một cốc, đợi một chút — nếu vẫn đói thì đó là đói thật, ăn. Nếu cơn đói tan đi, bạn vừa tiết kiệm được một bữa ăn vặt mà không phải gồng mình kiêng khem gì cả.</p>
<p>Đây là can thiệp giảm cân rẻ nhất và dễ tuân thủ nhất mà tôi biết.</p>
<h4 class="h3">Thời điểm 3 — Trước khi tắm khoảng nửa tiếng</h4>
<p>Thời điểm này ít người biết nhất.</p>
<p>Bạn thường tắm vào lúc nào? Chiều tối sau một ngày làm việc. Sau khi tập thể thao. Hoặc sáng sớm vừa ngủ dậy.</p>
<p>Cả ba đều là những lúc cơ thể bạn đang thiếu nước.</p>
<p>Và tắm là lúc cơ thể phải xử lý một sự thay đổi nhiệt độ khá lớn trong thời gian ngắn. Cấp nước trước cho cơ thể ở trạng thái tốt hơn để đón cú thay đổi đó.</p>
<p><strong>Đi kèm là một thói quen tôi mong bạn tập luôn — cách vào nước.</strong></p>
<p>Đừng dội thẳng nước từ đỉnh đầu xuống. Hãy để cơ thể làm quen dần theo thứ tự từ dưới lên: làm ướt bàn chân trước, rồi lên đầu gối, lên hông, lên bụng, ướt hai cánh tay, lên ngực, và <strong>cuối cùng mới lên đầu</strong>.</p>
<p>Khi cả người đã quen với nước rồi thì xối thoải mái.</p>
<p>Nghe thì nhỏ nhặt. Nhưng với người lớn tuổi, người tim mạch yếu, hoặc bất cứ ai tắm khuya, tắm sau khi vừa vận động mạnh — thì đây là một trong những thói quen nhỏ đáng giữ nhất.</p>
<p>Và nếu hôm nào bạn bận, tắm vội, không kịp uống nước trước — cũng đừng căng thẳng. Điều tối thiểu cần giữ là: <strong>nhiệt độ nước đừng chênh quá nhiều so với cơ thể, và vào nước từ từ.</strong></p>
<h4 class="h3">Thời điểm 4 — Trước khi đi ngủ khoảng một tiếng</h4>
<p>Cơ thể bạn không tắt máy khi bạn ngủ. Nó vẫn thở, vẫn tuần hoàn, vẫn sửa chữa, vẫn mất nước suốt đêm.</p>
<p>Nên đi ngủ trong tình trạng thiếu nước là một cách tự làm khó mình.</p>
<p>Thực tế, <strong>một trong những lý do khiến giấc ngủ chập chờn là cơ thể không đủ nước</strong> — điều mà hầu như không ai nghĩ tới khi than phiền về chuyện khó ngủ.</p>
<p><strong>Cách làm:</strong> một cốc nước vừa phải, uống trước giờ lên giường khoảng một tiếng. Khoảng cách một tiếng là để bạn kịp đi vệ sinh trước khi ngủ, chứ không phải dậy giữa đêm.</p>
<p>Nếu bạn thuộc nhóm khó ngủ, có thể thay bằng một cốc <strong>sữa ấm không đường</strong> — sữa không đường, ít béo hoặc tách béo đều được.</p>
<h4 class="h3">Và phần còn lại</h4>
<p>Bốn cốc này là khung. Lượng nước còn lại của ngày, bạn rải đều vào những khoảng trống khác, ưu tiên buổi sáng và đầu giờ chiều.</p>
<p>Điều quan trọng là: <strong>bốn mốc trên là cố định, không thương lượng.</strong> Phần rải thêm thì linh hoạt theo ngày.</p>
<hr class="brk">
<h3 class="h2">Chương 11: Uống bao nhiêu là đủ với riêng bạn</h3>
<p>Đến đây chắc bạn đang chờ một con số.</p>
<p>Tôi sẽ nói thẳng một điều: <strong>con số "hai lít mỗi ngày" mà bạn nghe khắp nơi không đúng cho tất cả mọi người.</strong></p>
<h4 class="h3">Vì sao không có một con số chung</h4>
<p>Nhu cầu nước của bạn phụ thuộc vào ít nhất bốn thứ:</p>
<p><strong>Cân nặng.</strong> Một người nhỏ nhắn và một người to lớn không thể cần cùng một lượng nước.</p>
<p><strong>Tuổi.</strong> Nhu cầu nước tính theo cân nặng thay đổi theo độ tuổi — người trẻ, người trung niên và người lớn tuổi có mức khác nhau rõ rệt. Trẻ em thì tính theo một cách hoàn toàn riêng.</p>
<p><strong>Mức vận động.</strong> Người làm việc chân tay ngoài trời và người ngồi văn phòng máy lạnh không cùng một nhu cầu. Đây là yếu tố bị bỏ qua nhiều nhất.</p>
<p><strong>Hoàn cảnh.</strong> Trời nóng, ra nhiều mồ hôi, đang cho con bú, đang ốm sốt — đều cần cộng thêm.</p>
<p>Nên khi ai đó đưa cho bạn một con số duy nhất áp cho mọi người, con số đó chắc chắn đúng với một số người và sai với phần còn lại.</p>
<h4 class="h3">Một điều quan trọng hơn con số: nước tổng và nước uống</h4>
<p>Đây là chỗ gây nhầm lẫn nhiều nhất, và cũng là chỗ tôi muốn bạn nắm cho chắc.</p>
<p>Nước vào cơ thể bạn theo <strong>ba đường</strong>, không phải một:</p>
<ol><li><strong>Nước bạn uống bằng miệng</strong> — nước lọc và các loại nước khác.</li><li><strong>Nước trong thức ăn</strong> — canh, rau, củ, quả, sữa, cháo. Nhiều hơn bạn tưởng rất nhiều.</li><li><strong>Nước cơ thể tự tạo ra</strong> từ chính quá trình chuyển hoá thức ăn.</li></ol>
<p>Cộng cả ba lại mới ra <strong>nước tổng</strong> — tức là toàn bộ nhu cầu nước của cơ thể trong ngày.</p>
<p>Nghĩa là:</p>
<div class="quote"><p><strong>Phần bạn phải uống bằng miệng LUÔN NHỎ HƠN tổng nhu cầu nước của cơ thể.</strong></p></div>
<p>Đây là lý do rất nhiều người ép mình uống cho bằng được một con số lớn, thấy mệt, thấy đi vệ sinh suốt, rồi bỏ cuộc. Họ đang cố uống bằng miệng cái con số vốn đã bao gồm cả canh, cả rau, cả sữa họ ăn trong ngày.</p>
<h4 class="h3">Vậy tôi khuyên bạn điều gì</h4>
<div class="keep"><p><strong>Nếu bạn muốn một hướng dẫn đơn giản để bắt đầu ngay hôm nay:</strong></p><ul><li>Làm cho đủ <strong>bốn cốc ở bốn thời điểm vàng</strong> trong chương 10.</li><li>Rải thêm vài cốc nữa trong ngày, mỗi lần một cốc vừa phải.</li><li><strong>Ưu tiên nước lọc.</strong> Đừng lo lắng quá nhiều về nước tổng — nếu bạn ăn đủ rau củ và có canh trong bữa, phần đó tự lo được.</li><li>Quan sát cơ thể: nước tiểu màu nhạt, da đỡ khô, người đỡ uể oải, ngủ sâu hơn — đó là những tín hiệu đáng tin hơn bất kỳ con số nào.</li></ul></div>
<p><strong>Nếu bạn muốn con số chính xác cho riêng mình:</strong></p>
<p>Con số đó phải tính từ cân nặng, tuổi, mức vận động và tình trạng sức khoẻ của bạn — và nó dựa trên bảng khuyến nghị chính thức, không phải một công thức truyền miệng. Đây là việc tôi làm trực tiếp trong buổi tư vấn, vì nó cần hỏi bạn vài câu trước khi trả lời.</p>
<div class="callout"><div class="ctitle">Ba câu để bạn tự đánh giá mọi lời khuyên về nước</div><p><strong>1. Thứ này có calo không?</strong> Nếu có, nó là đồ ăn, phải tính vào phần ăn của bạn — không tính vào phần nước.</p><p><strong>2. Người nói có đang hứa một kết quả lớn từ một hành động rất nhỏ không?</strong> Nếu có, hãy nghi ngờ. Sức khoẻ không vận hành theo cách đó.</p><p><strong>3. Nếu bỏ thứ này đi, tôi vẫn ăn uống và sinh hoạt như cũ — kết quả có thay đổi không?</strong> Nếu câu trả lời trung thực là "không", thì thứ đó không phải là nguyên nhân.</p></div>
<hr class="brk">
<h3 class="h2">Chương 12: Bốn nhóm người cần lưu ý riêng</h3>
<p>Nếu bạn không thuộc bốn nhóm dưới đây, cứ áp dụng những gì đã đọc là đủ.</p>
<h4 class="h3">1. Người đang giảm cân</h4>
<p>Ba việc dành riêng cho bạn:</p>
<p><strong>Cốc nước trước bữa ăn là bạn thân nhất của bạn.</strong> Nó vừa giúp tiêu hoá, vừa giúp bạn không ăn quá đà.</p>
<p><strong>Dùng nước để kiểm tra cơn đói.</strong> Thấy thèm ăn giữa buổi thì uống một cốc và đợi một lúc. Rất nhiều lần bạn sẽ phát hiện ra đó không phải đói.</p>
<p><strong>Ăn chậm, nhai kỹ.</strong> Vì cảm giác no cần thời gian để đến. Ăn nhanh là cách chắc chắn nhất để ăn quá phần mình cần mà không hề biết.</p>
<h4 class="h3">2. Người hay tiểu đêm, tiểu rắt</h4>
<p>Nhóm này thường gặp ở người lớn tuổi, và phản ứng tự nhiên là <strong>nhịn uống nước</strong> cho đỡ phải dậy đêm.</p>
<p>Đó là một cái bẫy. Nhịn nước không giải quyết được vấn đề bàng quang, mà lại tạo ra một vấn đề mới là thiếu nước kéo dài.</p>
<p>Cách làm đúng là <strong>dồn phần lớn lượng nước về ban ngày</strong>, giữ phần buổi tối nhỏ lại và uống cách giờ ngủ đủ xa — chứ không phải cắt bỏ.</p>
<p>Ngoài ra có một số bài tập giúp cải thiện tình trạng này. Nhưng chúng <strong>chỉ dành riêng cho nhóm có vấn đề</strong>, và cần hướng dẫn cụ thể. Người bình thường thì tuyệt đối không nên nhịn tiểu.</p>
<p>Và nếu tình trạng nặng hoặc mới xuất hiện gần đây, hãy đi khám. Đây là chỗ ebook dừng lại và bác sĩ bắt đầu.</p>
<h4 class="h3">3. Người tiểu đường</h4>
<p>Đường huyết cao khiến máu dễ cô đặc hơn, nên nhóm này <strong>cần chú ý uống đủ nước hơn người bình thường</strong>, và thường cần cộng thêm một chút so với mức chung.</p>
<p>Quan trọng không kém là <strong>cách uống</strong>: chia nhỏ, nhấp từng chút, rải đều cả ngày. Nhóm này càng không nên uống dồn.</p>
<p>Mọi điều chỉnh nên được đặt cạnh phác đồ điều trị bạn đang theo.</p>
<h4 class="h3">4. Người bị gout</h4>
<p>Cơ thể bạn cần đào thải axit uric dư thừa qua thận, và thận cần nước để làm việc đó. Không đủ nước thì nguy cơ sỏi thận tăng lên đáng kể.</p>
<p>Nhóm này cũng nên uống nhiều hơn mức chung một chút, và rải đều trong ngày.</p>
<h4 class="h3">Và một nhóm cần nói riêng</h4>
<p>Nếu bạn đang có <strong>bệnh thận, bệnh tim, bệnh gan</strong>, hoặc bất kỳ tình trạng nào mà bác sĩ đã dặn hạn chế lượng dịch — thì <strong>mọi lời khuyên về lượng nước trong cuốn sách này không áp dụng cho bạn</strong>. Hãy làm theo chỉ định của bác sĩ.</p>
<p>Phần kỹ thuật uống — uống chậm, ngụm nhỏ, ngồi khi uống — thì vẫn dùng được bình thường.</p>
<hr class="brk"><div class="part">PHẦN IV — BẠN PHẦN LỚN LÀ NƯỚC</div>
<h3 class="h2">Chương 13: Cảm xúc, cơ thể và chuyện chuyển hoá</h3>
<p>Chương này hơi khác những chương trước. Nó không dạy bạn thêm một kỹ thuật nào cả.</p>
<p>Nhưng nó trả lời một câu hỏi mà mười hai chương trước chưa chạm tới: <strong>vì sao có những giai đoạn bạn biết rõ mình phải uống nước, mà vẫn không làm được?</strong></p>
<p>Câu trả lời không nằm ở nước. Nó nằm ở chỗ bạn đang sống thế nào trong những ngày ấy.</p>
<p>Và đến cuối chương, chúng ta sẽ quay lại đúng cái cốc nước ở chương 9 — vẫn cốc nước đó, vẫn cách uống đó, nhưng nhìn bằng một con mắt khác. Bạn sẽ thấy nó không chỉ là việc cấp nước cho cơ thể. Nó còn là một khoảng dừng để bạn quay về với chính mình.</p>
<p>Đây là điều tôi muốn bạn mang theo lâu nhất sau khi gấp cuốn sách lại.</p>
<h4 class="h3">Quay lại con số ở chương 2</h4>
<p>Sáu đến bảy phần mười trọng lượng cơ thể bạn là nước.</p>
<p>Bạn không phải là một khối rắn. Bạn gần với một <strong>dòng chảy</strong> hơn — một dòng chảy được giữ trong hình hài này, luân chuyển không ngừng, mang oxy đi khắp nơi, mang chất thải ra ngoài, làm mát bạn, làm mềm bạn, giữ cho bạn sống.</p>
<p>Và một dòng chảy thì luôn phản ứng với hoàn cảnh của nó.</p>
<div class="quote"><p><strong>Cảm xúc của bạn thay đổi cách cơ thể bạn xử lý nước. Và cách cơ thể bạn xử lý nước thì hiện lên trên gương mặt bạn.</strong></p></div>
<p>Đây không phải chuyện huyền bí. Đây là chuyện bạn đã tự chứng kiến cả đời mà chưa gọi tên.</p>
<h4 class="h3">Khi bạn buồn, lo, giận — cơ thể bạn khô đi</h4>
<p>Hãy nhớ lại lần gần nhất bạn thật sự căng thẳng. Một kỳ deadline. Một cuộc cãi vã. Một tin không vui.</p>
<p>Chuyện gì xảy ra với cơ thể bạn?</p>
<p><strong>Bạn thở nhanh và nông hơn.</strong> Mỗi hơi thở đều mang một ít nước ra khỏi người bạn. Thở gấp cả ngày là mất nước nhiều hơn cả ngày.</p>
<p><strong>Tim đập nhanh, người nóng lên, bạn đổ mồ hôi</strong> — kể cả khi ngồi yên trong phòng lạnh. Đó lại là nước đi ra.</p>
<p><strong>Bạn quên uống nước.</strong> Đây là điều tôi thấy nhiều nhất ở khách hàng. Người đang lo lắng thì không nhớ đến cốc nước. Họ nhớ đến ly cà phê thứ ba, điếu thuốc, cốc trà sữa, ly rượu buổi tối — những thứ khiến họ mất nước thêm.</p>
<p><strong>Bạn ngủ không sâu.</strong> Đêm là lúc cơ thể sửa chữa và tái tạo — và mọi việc sửa chữa đó đều cần nước, cần thời gian. Ngủ chập chờn là cắt ngắn ca làm việc đó.</p>
<p><strong>Bạn ăn thất thường.</strong> Bỏ bữa, hoặc ăn cho qua, hoặc ăn thật nhiều đồ mặn và đồ ngọt. Cả hai hướng đều làm cơ thể phải làm việc vất vả hơn để giữ cân bằng nước.</p>
<p>Cộng tất cả lại, một tuần sống trong căng thẳng là một tuần cơ thể bạn vừa mất nước nhiều hơn, vừa được cấp nước ít hơn.</p>
<h4 class="h3">Và bạn nhìn thấy nó trên gương mặt mình</h4>
<p>Đây là lý do vì sao chỉ cần vài ngày mệt mỏi là người quen gặp bạn đã hỏi <em>"dạo này sao trông hốc hác thế?"</em></p>
<p>Họ không nhìn thấy nỗi lo của bạn. Họ nhìn thấy <strong>hậu quả của nỗi lo trên lớp nước dưới da bạn</strong>:</p>
<ul><li>Da xỉn đi, mất vẻ căng mọng, đường nhăn hiện rõ hơn bình thường.</li><li>Môi khô, nứt.</li><li>Mắt trũng, quầng thâm đậm hơn.</li><li>Tóc xơ, thiếu sức sống.</li><li>Người nặng nề, uể oải, bụng ì ạch, táo bón.</li></ul>
<p>Và điều nghiệt ngã là nó tạo thành một <strong>vòng xoáy đi xuống</strong>: bạn mệt → bạn quên chăm mình → cơ thể thiếu nước → bạn mệt hơn, nhìn kém sắc hơn → soi gương thấy vậy lại càng xuống tinh thần.</p>
<p>Rất nhiều người đến gặp tôi ở đúng điểm này của vòng xoáy. Họ nghĩ họ cần một loại kem mới, một loại viên uống mới, một liệu trình đắt tiền.</p>
<p>Thường thì thứ họ cần là ngủ đủ, thở chậm lại, và uống nước tử tế.</p>

<p>Giờ hãy nhớ lại một quãng thời gian bạn thật sự thấy ổn. Một kỳ nghỉ. Một giai đoạn mọi việc đâu vào đấy. Những ngày bạn ngủ ngon và thức dậy không thấy nặng ngực.</p>
<p>Bạn có nhớ mình trông thế nào trong những ngày đó không?</p>
<p>Người ta hay nói <em>"dạo này trông tươi thế"</em>, <em>"da dẻ hồng hào hẳn"</em>, <em>"nhìn cứ khác hẳn"</em>. Và bạn thường cười, bảo chẳng làm gì cả.</p>
<p>Bạn có làm. Chỉ là bạn không để ý.</p>
<p>Khi tinh thần bạn nhẹ:</p>
<p><strong>Bạn thở sâu và đều.</strong> Cơ thể giữ nước tốt hơn.</p>
<p><strong>Bạn ngủ sâu.</strong> Ca sửa chữa ban đêm chạy đủ giờ. Da được tái tạo. Quầng mắt mờ đi.</p>
<p><strong>Bạn ăn uống có nề nếp trở lại.</strong> Nhớ bữa, nhớ rau, nhớ cốc nước.</p>
<p><strong>Bạn chăm mình.</strong> Người đang vui thì tự khắc muốn chăm sóc bản thân. Muốn đi bộ. Muốn nấu một bữa tử tế. Muốn uống đủ nước. Không ai phải nhắc.</p>
<p><strong>Cơ thể được cấp đủ nước thì làm việc trơn tru.</strong> Máu lưu thông tốt, dưỡng chất đến được nơi cần đến — kể cả những mao mạch nhỏ nhất nuôi làn da bạn.</p>
<p>Và kết quả bạn nhìn thấy: <strong>da sáng và căng hơn, mắt trong hơn, người nhẹ, đầu óc tỉnh táo, làm việc thấy có sức.</strong></p>
<p>Đó không phải phép màu. Đó là một cơ thể đủ nước, được nghỉ ngơi, đang vận hành đúng như nó vốn được thiết kế.</p>
<h4 class="h3">Nhưng chưa ai ra lệnh cho mình vui được</h4>
<p>Đọc đến đây, có thể bạn đang nghĩ: <em>"Biết rồi, vui thì tốt. Nhưng tôi có muốn buồn đâu."</em></p>
<p>Bạn nói đúng. Và đây chính là chỗ mà lời khuyên "hãy suy nghĩ tích cực lên" thường chưa đủ.</p>
<p>Không ai ra lệnh cho mình vui được. Cảm xúc không nghe lệnh.</p>
<p>Nhưng có một điều ít người được chỉ cho: <strong>cảm xúc không đến thẳng từ sự việc.</strong> Giữa hai thứ đó luôn có một mắt xích ở giữa — và mắt xích ấy thì bạn động vào được.</p>
<h4 class="h3">Bốn nhịp mà cảm xúc nào cũng đi qua</h4>
<p>Bất kỳ cảm xúc nào của bạn cũng đi qua đúng bốn nhịp này:</p>
<p><strong>Kích hoạt → Diễn giải → Cảm xúc → Hành vi</strong></p>
<p><strong>Kích hoạt</strong> là chuyện xảy ra bên ngoài. Một câu nói. Một tin nhắn. Một ánh mắt.</p>
<p><strong>Diễn giải</strong> là cách bạn hiểu chuyện đó — qua niềm tin, ký ức, giá trị sống, nhu cầu sâu bên trong bạn. Đây là bộ lọc của riêng bạn, và không ai có bộ lọc giống bạn.</p>
<p><strong>Cảm xúc</strong> sinh ra từ cách diễn giải ấy — <strong>không phải từ chính sự việc</strong>.</p>
<p><strong>Hành vi</strong> là thứ bạn làm sau đó. Bao gồm cả việc bạn quên uống nước, bỏ bữa, thức khuya, hay tìm đến ly rượu.</p>
<p>Đây là lý do vì sao cùng một câu góp ý, ba người nghe ra ba chuyện khác nhau. Người thì thấy <em>"mình bị coi thường"</em> và giận. Người thấy <em>"mình vừa học được gì đó"</em> và biết ơn. Người thấy <em>"mình kém quá"</em> và xấu hổ.</p>
<p>Sự việc y hệt nhau. Cảm xúc khác nhau hoàn toàn. Khác nhau ở nhịp thứ hai.</p>
<h4 class="h3">Và đó là chỗ để chuyển hoá</h4>
<p><strong>Chuyển hoá không phải là ép mình vui. Chuyển hoá là chạm vào nhịp thứ hai.</strong></p>
<p>Bạn không đổi được chuyện đã xảy ra. Nhưng cách bạn hiểu nó thì đổi được — và khi cách hiểu đổi, cảm xúc tự đổi theo. Bạn không phải gồng lên chút nào.</p>
<p>Có một điều nữa cũng cần nói thẳng: <strong>cảm xúc tiêu cực không phải kẻ thù của bạn.</strong> Nó là tín hiệu. Nó thường đang báo một trong ba chuyện — một giá trị của bạn vừa bị xâm phạm, một nhu cầu của bạn chưa được đáp ứng, hoặc một niềm tin cũ đang giới hạn bạn.</p>
<p>Cơn giận không phải thứ để dẹp đi. Nó là thứ để đọc.</p>
<p>Giống hệt cơn khát ở chương một vậy — nó là tín hiệu, và tín hiệu thì đáng được lắng nghe chứ không đáng bị mắng.</p>
<h4 class="h3">Vì sao tôi kể chuyện này trong một cuốn sách về nước</h4>
<p>Vì cơ thể bạn là <strong>cánh cửa dễ đi nhất</strong> để vào nhịp thứ hai.</p>
<p>Khi bạn đang cuộn trong cảm xúc, bảo bạn "hãy nhìn lại cách mình đang diễn giải" là điều gần như bất khả thi — lúc đó bạn không còn khoảng trống nào trong đầu để làm việc đó.</p>
<p>Thứ bạn cần trước tiên không phải là một suy nghĩ mới. Thứ bạn cần là <strong>một khoảng dừng</strong>.</p>
<p>Và cốc nước cho bạn đúng cái khoảng dừng ấy.</p>
<p>Bạn còn nhớ kỹ thuật ở chương 9 chứ? Ngồi xuống. Ngụm nhỏ. Ngậm vài giây. Nuốt từ từ. Một phút.</p>
<p>Một phút đó, xét về mặt cảm xúc, chính là một phút bạn <strong>không phản ứng</strong>. Nhịp thở chậm lại. Cơ thể được báo rằng không có nguy hiểm gì. Và trong khoảng lặng vừa mở ra ấy, bạn mới đủ tỉnh để hỏi mình một câu.</p>
<h4 class="h3">Ba câu hỏi cho khoảng lặng đó</h4>
<p>Khi đã ngồi xuống với cốc nước rồi, hãy thử hỏi mình — nhẹ thôi, không cần trả lời cho bằng được:</p>
<p><strong>"Mình đang sợ điều gì?"</strong></p>
<p><strong>"Mình đang cần điều gì?"</strong></p>
<p><strong>"Mình đang tin điều gì về bản thân trong lúc này?"</strong></p>
<p>Câu thứ ba thường là câu chạm sâu nhất. Vì phía sau một cơn giận, một nỗi buồn dai dẳng, thường không phải sự việc — mà là một câu bạn đang âm thầm tin về chính mình.</p>
<p>Và nếu hôm ấy bạn còn đủ sức đi thêm một bước, hãy thử câu này:</p>
<div class="quote"><p><strong><em>"Chuyện này có thể đang dạy mình điều gì?"</strong></em></p></div>
<p>Đây là một câu hỏi rất nhỏ nhưng có sức đổi khung rất lớn. Nó không bắt bạn phủ nhận rằng chuyện đó khó. Nó chỉ mở thêm một cách hiểu khác bên cạnh cách hiểu cũ.</p>
<p>Và chỉ cần có thêm một cách hiểu, bạn đã không còn bị nhốt trong cách hiểu ban đầu nữa.</p>
<h4 class="h3">Vòng xoáy đi lên</h4>
<p>Nhớ cái vòng xoáy đi xuống ở đầu chương chứ? Mệt → quên chăm mình → thiếu nước → nhìn kém sắc → càng xuống tinh thần.</p>
<p>Vòng xoáy này quay được cả hai chiều. Và bạn có thể đẩy nó từ bất kỳ điểm nào trên vòng.</p>
<p>Bạn chưa gỡ được chuyện đang làm mình nặng lòng? Không sao. Hãy đẩy ở điểm dễ nhất:</p>
<p>Uống nước tử tế → cơ thể đủ nước, đầu óc bớt nặng → ngủ sâu hơn → sáng dậy nhìn mình đỡ mệt hơn → tinh thần khá hơn một chút → đủ sức nhìn lại chuyện cũ bằng con mắt khác → cảm xúc dịu đi → và bạn lại chăm mình tốt hơn nữa.</p>
<p>Chăm sóc cơ thể và chăm sóc tinh thần không phải hai việc khác nhau. Chúng là <strong>hai đầu của cùng một sợi dây</strong> — và bạn có thể kéo từ đầu nào cũng được.</p>
<p>Hôm nay đầu nào dễ hơn thì kéo đầu đó.</p>
<h4 class="h3">Điều tôi thật sự muốn nói với bạn</h4>
<p>Có những ngày bạn không đủ sức để thay đổi hoàn cảnh, không gỡ được chuyện đang làm mình nặng lòng, và cũng chẳng buồn hỏi mình câu nào cả.</p>
<p>Những ngày ấy, đừng bắt mình phải vui lên.</p>
<p>Hãy làm điều nhỏ nhất bạn còn làm được: <strong>rót một cốc nước, ngồi xuống, và uống thật chậm.</strong></p>
<p>Nghe có vẻ chẳng đáng gì. Nhưng trong một phút ấy, bạn đang làm ba việc cùng lúc:</p>
<ul><li>Bạn cấp nước cho một cơ thể đang cần.</li><li>Bạn buộc nhịp thở của mình chậm lại, và mở ra một khoảng lặng giữa chuyện đã xảy ra và phản ứng của bạn.</li><li>Và bạn gửi cho chính mình một thông điệp rất rõ: <em>tôi vẫn đang chăm sóc mình.</em></li></ul>
<p>Đó là lý do tôi tin cốc nước là nơi tốt nhất để bắt đầu. Không phải vì nó là thứ quan trọng nhất — mà vì nó là thứ <strong>dễ nhất</strong>, và vào những ngày khó khăn thì cái dễ nhất chính là cái quý nhất.</p>
<p>Bạn phần lớn là nước.</p>
<p>Hãy đối xử với dòng nước ấy — và với người đang mang nó — một cách tử tế.</p>
<div class="callout"><div class="ctitle">Nếu chương này chạm đến bạn</div><p>Bốn nhịp cảm xúc và cách đổi khung ở trên mới chỉ là phần rất nhỏ, đủ để bạn dùng ngay trong những ngày thường.</p><p>Việc đi sâu hơn — nhìn ra bộ lọc của riêng bạn, lật những niềm tin cũ đang giới hạn bạn, và chuyển hoá những cảm xúc đã ở lại quá lâu — là một hành trình khác, cần thời gian và cần có người đi cùng.</p><p>Đó là công việc còn lại của tôi, bên cạnh dinh dưỡng.</p></div>
<hr class="brk"><div class="part">PHẦN V — BẮT ĐẦU</div>
<h3 class="h2">Chương 14: Bảy ngày đầu tiên</h3>
<p>Bạn vừa đọc rất nhiều thứ. Đừng cố làm hết cùng lúc — đó là cách chắc chắn nhất để tuần sau quay về y như cũ.</p>
<p>Đây là lộ trình tôi giao cho khách hàng của mình.</p>
<h4 class="h3">Ngày 1–2: Chỉ làm một việc</h4>
<p><strong>Đặt một cốc nước cạnh giường tối nay. Sáng mai dậy, uống chậm trước khi đặt chân xuống đất.</strong></p>
<p>Chỉ vậy. Không làm gì khác.</p>
<p>Đây là cốc nước quan trọng nhất trong ngày, và nó cũng là thói quen dễ gắn nhất vì bạn không thể quên — cốc nước nằm ngay đó.</p>
<h4 class="h3">Ngày 3–4: Thêm cách uống</h4>
<p>Giữ cốc nước buổi sáng. Thêm hai quy tắc:</p>
<p><strong>Ngồi xuống khi uống. Uống từng ngụm nhỏ.</strong></p>
<p>Hai việc này không tốn thêm chút nỗ lực nào, chỉ cần bạn nhớ.</p>
<h4 class="h3">Ngày 5–6: Thêm cốc nước trước bữa ăn</h4>
<p>Giữ hai cái trên. Thêm:</p>
<p><strong>Một cốc nước trước bữa trưa hoặc bữa tối, cách bữa ăn khoảng nửa tiếng.</strong></p>
<p>Chưa cần làm cả các bữa. Một bữa thôi, bữa nào dễ nhất với lịch của bạn.</p>
<p>Cùng lúc đó: <strong>bớt cốc nước trong bữa ăn.</strong> Nếu chưa bỏ được thì giảm dần.</p>
<h4 class="h3">Ngày 7: Thêm cốc nước buổi tối</h4>
<p><strong>Một cốc trước khi lên giường khoảng một tiếng.</strong></p>
<p>Đến đây bạn đã có ba trong bốn thời điểm vàng, và đã đổi được cách uống. Cốc trước khi tắm thì thêm vào tuần sau.</p>
<h4 class="h3">Tuần thứ hai trở đi</h4>
<ul><li>Thêm thời điểm còn lại: trước khi tắm.</li><li>Thêm quy tắc ngậm nước vài giây trước khi nuốt.</li><li>Tập ăn chậm hơn một chút mỗi bữa.</li><li>Đổi chai lớn lấy cốc.</li></ul>
<h4 class="h3">Bạn sẽ nhận ra điều gì</h4>
<p>Nếu bạn làm đúng, trong khoảng một đến hai tuần bạn sẽ thấy vài thứ:</p>
<ul><li><strong>Đi vệ sinh ổn định hơn.</strong> Không còn chuyện uống xong là muốn đi ngay.</li><li><strong>Ít khát hơn trong bữa ăn.</strong> Đây là dấu hiệu rõ nhất cho thấy cơ thể bạn đã bớt thiếu nước.</li><li><strong>Miệng đỡ khô</strong> khi nói chuyện, khi thuyết trình.</li><li><strong>Buổi sáng dậy dễ chịu hơn.</strong></li><li><strong>Ngủ sâu hơn một chút.</strong></li></ul>
<p>Da và mức năng lượng chung thì cần lâu hơn — hãy cho nó vài tuần.</p>

<h4 class="h3">Một lời cuối</h4>
<p>Không có gì trong cuốn sách này là khó.</p>
<p>Không có món nào bạn phải bỏ. Không có thứ gì bạn phải mua. Không có kỷ luật nào bạn phải gồng.</p>
<p>Bạn chỉ cần uống nước — thứ bạn vốn đã uống mỗi ngày — theo một cách hơi khác. Chậm hơn vài chục giây. Vào bốn thời điểm cố định. Không dồn một lúc.</p>
<p>Và mỗi lần bạn ngồi xuống uống cốc nước ấy, hãy nhớ rằng bạn không chỉ đang làm một việc vặt cho cơ thể. Bạn đang chăm sóc phần lớn nhất của chính con người mình.</p>
<p>Đây có lẽ là thay đổi có tỉ lệ <strong>lợi ích trên công sức</strong> cao nhất trong toàn bộ việc chăm sóc sức khoẻ.</p>
<p>Và nó bắt đầu được ngay từ cốc nước tiếp theo của bạn.</p>
<p>Chúc bạn khoẻ.</p>
<p><strong>Thanh Thuỷ</strong></p>
<hr class="brk">
<h3 class="h2">PHỤ LỤC — BẢNG TỰ KIỂM</h3>
<p>Đánh dấu những điều bạn đang làm được:</p>
<p><strong>Về thời điểm</strong></p>
<ul class="chk"><li><span class="box"></span>Tôi uống nước theo lịch, không đợi khát mới uống</li><li><span class="box"></span>Tôi uống một cốc ngay khi vừa ngủ dậy, trước khi làm việc khác</li><li><span class="box"></span>Tôi uống một cốc trước bữa ăn khoảng nửa tiếng đến một tiếng</li><li><span class="box"></span>Tôi uống một cốc trước khi tắm</li><li><span class="box"></span>Tôi uống một cốc trước khi đi ngủ một khoảng, không uống sát giờ ngủ</li><li><span class="box"></span>Phần lớn lượng nước của tôi được uống vào ban ngày</li></ul>
<p><strong>Về cách uống</strong></p>
<ul class="chk"><li><span class="box"></span>Tôi ngồi khi uống nước, không đứng tu</li><li><span class="box"></span>Tôi uống từng ngụm nhỏ</li><li><span class="box"></span>Tôi ngậm nước vài giây trước khi nuốt</li><li><span class="box"></span>Tôi uống một cốc trong khoảng một phút, không phải mười giây</li><li><span class="box"></span>Tôi không dốc cạn cả chai trong một lần</li></ul>
<p><strong>Về bữa ăn</strong></p>
<ul class="chk"><li><span class="box"></span>Tôi không uống nước ngay trước, trong hoặc ngay sau bữa ăn</li><li><span class="box"></span>Tôi húp canh vừa phải, không dùng canh thay nước</li><li><span class="box"></span>Tôi nhai kỹ và ăn chậm hơn trước</li><li><span class="box"></span>Nhà tôi nấu canh nhạt hơn trước</li></ul>
<p><strong>Về loại nước</strong></p>
<ul class="chk"><li><span class="box"></span>Nước lọc là lựa chọn mặc định của tôi</li><li><span class="box"></span>Tôi tính nước ngọt, nước ép, sinh tố vào phần ăn chứ không phải phần nước</li><li><span class="box"></span>Tôi không dùng bia rượu thay nước</li><li><span class="box"></span>Tôi không uống nước quá lạnh</li><li><span class="box"></span>Trẻ trong nhà tôi hạn chế nước đóng hộp và nước giải khát</li></ul>
<p><strong>Về bản thân bạn</strong></p>
<ul class="chk"><li><span class="box"></span>Tôi ngủ đủ và ngủ sâu hơn trước</li><li><span class="box"></span>Những ngày căng thẳng, tôi để ý uống nước nhiều hơn chứ không phải ít hơn</li><li><span class="box"></span>Tôi coi việc chăm sóc cơ thể là một cách chăm sóc tinh thần, không phải hai việc tách rời</li></ul>
<p>Nếu bạn tick được quá nửa, bạn đã đi trước phần lớn mọi người.</p>
<hr class="brk">
<h3 class="h2">Lời nhắn cuối</h3>
<p>Cuốn ebook này cố ý nói ở mức nguyên tắc, vì nguyên tắc thì đúng với tất cả mọi người — còn con số thì tuỳ từng cơ thể.</p>

  var pages=[], cur=0, builtFor='';
  function build(){
    var key=stage.clientWidth+'x'+stage.clientHeight; if(key===builtFor) return; builtFor=key;
    var keep = pages[cur] ? +pages[cur].getAttribute('data-first') : -1;
    stage.innerHTML=''; pages=[];
    stage.style.setProperty('--img-max', Math.round(Math.min(stage.clientHeight*0.45, stage.clientWidth*0.62))+'px');
    var c=document.createElement('div'); c.className='page cover'; c.setAttribute('data-first','-1');
    c.innerHTML='<img src="'+COVER+'" alt="Bìa" draggable="false">'; stage.appendChild(c); pages.push(c);
    var blocks=Array.prototype.slice.call(document.getElementById('content').content.children), page=null;
    function newPage(i){ page=document.createElement('div'); page.className='page on'; page.setAttribute('data-first',i); stage.appendChild(page); pages.push(page); }
    blocks.forEach(function(b,i){
      if(b.classList.contains('brk')){ if(page && page.children.length) page=null; return; }
      if(!page) newPage(i);
      var node=b.cloneNode(true); page.appendChild(node);
      if(page.scrollHeight>page.clientHeight+2 && page.children.length>1){
        page.removeChild(node);
        var carry=[], last=page.lastElementChild;
        while(last && (/^H[34]$/.test(last.tagName) || last.classList.contains('part'))){ page.removeChild(last); carry.unshift(last); last=page.lastElementChild; }
        newPage(i); carry.forEach(function(n){ page.appendChild(n); }); page.appendChild(node);
      }
    });
    cur=0; for(var k=0;k<pages.length;k++){ if(+pages[k].getAttribute('data-first')<=keep) cur=k; }
    show();
  }
  function show(){
    pages.forEach(function(p,i){ p.classList.toggle('on', i===cur); });
    prev.disabled=cur===0; next.disabled=cur===pages.length-1;
    count.textContent=(cur===0?'Bìa':'Trang '+cur)+' / '+(pages.length-1);
  }
  function go(d){ var n=cur+d; if(n<0||n>=pages.length) return; cur=n; show(); }
  prev.addEventListener('click',function(){ go(-1); });
  next.addEventListener('click',function(){ go(1); });
  document.addEventListener('keydown',function(e){
    if((e.ctrlKey || e.metaKey) && (e.key === 's' || e.key === 'S' || e.key === 'p' || e.key === 'P' || e.key === 'u' || e.key === 'U')){

  var sx=null; stage.addEventListener('touchstart',function(e){ sx=e.touches[0].clientX; },{passive:true});
  stage.addEventListener('touchend',function(e){ if(sx===null) return; var dx=e.changedTouches[0].clientX-sx; if(Math.abs(dx)>50) go(dx<0?1:-1); sx=null; });

  document.addEventListener('contextmenu',function(e){ e.preventDefault(); });
  document.addEventListener('copy',function(e){ e.preventDefault(); });
  document.addEventListener('dragstart',function(e){ e.preventDefault(); });
  if(document.fonts && document.fonts.ready){ document.fonts.ready.then(build); } else { build(); }
