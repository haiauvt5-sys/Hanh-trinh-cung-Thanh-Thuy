<template id="content"><h3 class="h2">LỜI MỞ ĐẦU</h3>
<p>Có bao giờ bạn tự hỏi, tại sao chúng ta luôn dành rất nhiều thời gian để chăm lo cho công việc, gia đình và những người mình yêu thương, nhưng đôi khi lại quên mất việc chăm sóc chính cơ thể mình?</p>
<p>Chúng ta có thể nhớ hôm nay cần làm những việc gì, cần mua gì cho gia đình, cần giải quyết những vấn đề nào trong công việc. Nhưng đã bao lâu rồi bạn chưa thật sự dừng lại để tự hỏi: hôm nay mình đã ăn uống đầy đủ chưa, đã uống đủ nước chưa, đêm qua mình ngủ có ngon không và cơ thể mình đang cảm thấy thế nào?</p>
<p>Cơ thể chúng ta làm việc không ngừng nghỉ. Tim vẫn đập, phổi vẫn thở, não vẫn hoạt động, các tế bào vẫn liên tục thực hiện những nhiệm vụ cần thiết để duy trì sự sống. Và để thực hiện tất cả những công việc ấy, cơ thể cần được cung cấp năng lượng, chất dinh dưỡng, nước và thời gian nghỉ ngơi phù hợp.</p>
<p>Thế nhưng, trong cuộc sống bận rộn, nhiều người thường ăn uống qua loa, bỏ bữa, ngủ muộn, ít vận động hoặc chỉ quan tâm đến sức khoẻ khi cơ thể bắt đầu có những dấu hiệu khó chịu.</p>
<p>Chúng ta thường nghĩ rằng chỉ cần ăn no là được. Nhưng no bụng chưa chắc đã có nghĩa là cơ thể đã được cung cấp đầy đủ những gì cần thiết.</p>
<p>Một bữa ăn có thể giúp bạn no trong vài giờ, nhưng nếu thiếu sự đa dạng và cân bằng, cơ thể vẫn có thể chưa nhận đủ những chất dinh dưỡng cần thiết.</p>
<p>Vì vậy, trong cuốn ebook nhỏ này, Thuỷ muốn cùng bạn nhìn lại một điều rất gần gũi: những gì chúng ta ăn, uống và thực hiện mỗi ngày đang góp phần như thế nào vào sức khoẻ của mình.</p>
<p>Bạn sẽ cùng Thuỷ tìm hiểu cơ thể cần những nhóm chất dinh dưỡng nào, một bữa ăn cân bằng nên có những gì, cách lựa chọn thực phẩm phù hợp, vai trò của nước uống, giấc ngủ, vận động và cả mối liên hệ giữa cảm xúc với thói quen ăn uống.</p>
<p>Thuỷ không mong bạn phải thay đổi tất cả ngay lập tức. Cũng không muốn bạn cảm thấy áp lực vì phải ăn uống thật hoàn hảo.</p>
<p>Điều Thuỷ mong muốn là sau khi đọc xong, bạn có thể hiểu cơ thể mình hơn một chút, biết cách lựa chọn thực phẩm tốt hơn và bắt đầu xây dựng những thói quen chăm sóc sức khoẻ phù hợp với cuộc sống của mình.</p>
<p>Bởi sức khoẻ không được tạo nên từ một bữa ăn duy nhất, mà từ những lựa chọn nhỏ được lặp lại mỗi ngày.</p>
<p>Chúc bạn luôn khoẻ mạnh và biết yêu thương cơ thể mình nhiều hơn.</p>

<h3 class="h2">PHẦN 1. DINH DƯỠNG – NỀN TẢNG CỦA SỨC KHOẺ</h3>
<h4 class="h3">1. Mỗi ngày, cơ thể cần gì từ bữa ăn?</h4>
<p>Bạn có biết rằng ngay cả khi đang ngồi nghỉ, cơ thể vẫn không ngừng làm việc? Tim vẫn bơm máu, phổi vẫn trao đổi khí, não vẫn xử lý thông tin, và các tế bào vẫn lặng lẽ thực hiện những công việc cần thiết để duy trì sự sống.</p>
<p>Cơ thể còn liên tục thay mới và sửa chữa chính mình. Tóc mọc dài thêm, móng tay mọc lại, vết xước nhỏ vài hôm là lành. Tất cả những điều ấy cần hai thứ: <strong>năng lượng</strong> để hoạt động và <strong>vật liệu</strong> để xây, để sửa. Và nguồn cung cấp quan trọng nhất cho cả hai chính là những gì bạn ăn mỗi ngày.</p>
<p>Vì vậy, dinh dưỡng không chỉ là ăn để hết đói. Dinh dưỡng là cách để cơ thể có sức làm việc, học tập, vận động, đồng thời có nguyên liệu để duy trì và phục hồi những gì đã hao mòn.</p>
<p>Một bát mì tôm, một ổ bánh mì không, một ly trà sữa đều có thể làm bạn no. Nhưng những bữa như vậy cho cơ thể nhiều năng lượng mà lại rất ít vật liệu: thiếu rau, thiếu đạm, thiếu chất xơ. Ăn như thế một hôm thì không sao. Nhưng ngày nào cũng vậy thì cơ thể sẽ "no mà vẫn đói", đói chính những thứ nó thật sự cần.</p>
<p>Có một điều nhiều người chưa để ý: cơ thể cần những thứ này <strong>mỗi ngày</strong>. Cả tuần ăn uống qua loa rồi cuối tuần ăn một bữa thật đầy đủ cũng không bù lại được những ngày đã thiếu. Chăm cơ thể giống như tưới cây: tưới đều mỗi ngày một ít thì cây mới tươi.</p>
<p>Ngược lại, ăn quá nhiều năng lượng trong khi ít vận động, nhất là khi thường xuyên dùng đồ ngọt, đồ chiên rán nhiều dầu mỡ và những món quá nhiều muối, cũng làm tăng nguy cơ gặp các vấn đề sức khoẻ. Điều quan trọng không phải là ăn thật nhiều, cũng không phải cố loại bỏ mọi món mình yêu thích. Điều quan trọng là biết chọn thực phẩm, biết phối hợp các nhóm chất và xây dựng thói quen ăn uống phù hợp với nhu cầu của chính mình.</p>
<p>Thuỷ muốn bạn nhớ: ăn no là cảm giác của dạ dày, còn ăn đủ và cân bằng mới là cách chúng ta quan tâm đến nhu cầu của cả cơ thể.</p>
<p>Hãy thử nhìn lại ngày hôm qua của bạn. Bữa ăn ấy có những nhóm thực phẩm nào? Bạn có ăn rau, ăn quả không? Nguồn đạm có đa dạng không? Bạn có bỏ bữa, hoặc thay bữa ăn bằng đồ ăn nhanh, đồ uống nhiều đường không? Chỉ cần bắt đầu quan sát như vậy, bạn đã có bước đầu tiên để hiểu mình đang nuôi dưỡng cơ thể ra sao.</p>
<h4 class="h3">2. Một bữa ăn cân bằng cần những gì?</h4>
<p>Không có món nào chứa đủ mọi chất mà cơ thể cần, nên một bữa ăn cân bằng luôn là sự phối hợp của nhiều nhóm thực phẩm. Mỗi nhóm có một vai trò riêng. Hiểu vai trò ấy, bạn sẽ thấy việc chọn món trở nên dễ hơn nhiều.</p>
<p><strong>Chất bột đường: nguồn năng lượng cho cơ thể</strong></p>
<p>Chất bột đường (carbohydrate) là nhiên liệu chính để cơ thể làm việc cả ngày. Bạn gặp nó trong cơm, bún, phở, bánh mì, khoai, ngô và nhiều thực phẩm khác. Theo khuyến nghị dành cho người Việt Nam, chất bột đường nên chiếm khoảng một nửa đến gần hai phần ba năng lượng của cả ngày. Nghĩa là bạn không cần sợ tinh bột, và cũng không cần bỏ cơm ra khỏi bữa ăn.</p>
<p>Điều cần để ý là <em>loại</em> tinh bột bạn chọn. Gạo lứt, khoai lang, ngô, yến mạch, bánh mì nguyên cám và các loại đậu còn giữ nguyên chất xơ, vitamin và khoáng chất, nên no lâu hơn và làm đường trong máu tăng chậm hơn. Còn bánh mì trắng, bánh ngọt, bánh quy, kẹo, nước ngọt, nước trái cây đóng hộp là những thứ đã bị lấy đi gần hết chất xơ và vi chất. Chúng làm đường trong máu tăng nhanh, mà cho cơ thể rất ít chất bổ đi kèm.</p>
<p>Bạn không cần đổi tất cả cùng một lúc. Hôm nay trộn thêm một ít gạo lứt vào nồi cơm, hôm khác thay một phần cơm trắng bằng khoai lang hay ngô luộc, thế là đã đi đúng hướng rồi.</p>
<p><strong>Chất đạm: nguyên liệu xây dựng và duy trì cơ thể</strong></p>
<p>Chất đạm (protein) cần cho việc xây dựng, duy trì và sửa chữa các mô. Đạm tham gia cấu tạo cơ bắp, da, tóc, đồng thời góp phần tạo nên enzyme, hormone và các thành phần của hệ miễn dịch. Cơ thể luôn phải làm mới chính mình, nên cần đạm mỗi ngày.</p>
<p>Nguồn đạm không chỉ có thịt. Bạn có thể lấy từ cá, tôm, trứng, sữa, thịt gia cầm, đậu phụ, các loại đậu và các loại hạt. Thuỷ khuyến khích bạn đổi nguồn đạm thường xuyên và phối hợp cả đạm động vật lẫn đạm thực vật: hôm nay cá, ngày mai trứng, hôm khác là đậu phụ hay thịt nạc. Mỗi nguồn đạm mang theo những chất đi kèm khác nhau, nên đổi món cũng là cách làm cho bữa ăn giàu chất hơn.</p>
<p>Với thịt, câu hỏi đúng không chỉ là thịt tươi hay thịt đông, mà là loại thịt nào và ăn bao nhiêu. Thịt đỏ nên ăn vừa phải, thịt chế biến sẵn nên ăn thưa, còn cá và thịt gia cầm là những lựa chọn nên ưu tiên hơn.</p>
<p><strong>Chất béo: không phải cứ chất béo là xấu</strong></p>
<p>Nhiều người khi muốn giữ vóc dáng thường cắt chất béo quá mức. Nhưng chất béo vẫn là một phần cần thiết của bữa ăn: nó cung cấp năng lượng, tham gia cấu tạo màng tế bào, và giúp cơ thể hấp thu các vitamin tan trong dầu là A, D, E, K. Một đĩa rau xanh có thêm chút dầu ăn sẽ cho cơ thể nhiều hơn một đĩa rau luộc trơn.</p>
<p>Với người trưởng thành, chất béo nên chiếm khoảng một phần năm đến một phần tư năng lượng của ngày. Điều đáng quan tâm hơn là <em>loại</em> chất béo. Hãy ưu tiên cá, lạc, vừng, các loại hạt, quả bơ và dầu thực vật; dùng vừa đủ; và bớt dần những món chiên rán nhiều lần cũng như đồ chế biến sẵn. Thay vì chỉ nghĩ "ăn ít mỡ", hãy nghĩ "chọn đúng loại mỡ".</p>
<p><strong>Rau và quả: những màu sắc nuôi dưỡng cơ thể</strong></p>
<p>Rau và quả mang đến vitamin, khoáng chất, chất xơ cùng nhiều chất giúp bảo vệ tế bào. Cách dễ nhớ nhất là <strong>ăn theo sắc cầu vồng</strong>.</p>
<p>Màu đỏ và tím như cà chua, dưa hấu, dâu, cà tím, nho. Màu vàng và cam như cà rốt, bí đỏ, xoài, đu đủ. Màu xanh như rau muống, rau ngót, cải xanh, bông cải xanh. Màu trắng và các loại củ có mùi thơm như hành, tỏi, bắp cải, củ cải. Mỗi màu mang những chất bảo vệ riêng, nên đĩa càng nhiều màu, cơ thể càng nhận được nhiều thứ.</p>
<p>Bạn không cần tìm đủ mọi màu trong một bữa. Hãy bắt đầu bằng việc thêm một loại rau hay một loại quả mới vào bữa ăn quen thuộc. Làm đều đặn, sự đa dạng sẽ dần trở thành thói quen.</p>
<p><strong>Chất xơ: người bạn đồng hành của hệ tiêu hoá</strong></p>
<p>Chất xơ có nhiều trong rau, quả, các loại đậu, ngũ cốc nguyên hạt và các loại hạt. Nó hỗ trợ hoạt động của hệ tiêu hoá, và có hai nhóm làm hai việc khác nhau. Chất xơ không hoà tan, có trong rau lá, cà rốt, dưa chuột, gạo lứt, ngũ cốc nguyên hạt, giúp tiêu hoá đều đặn và đỡ táo bón. Chất xơ hoà tan, có trong yến mạch, các loại đậu, táo, lê, các loại quả mọng, làm chậm sự hấp thu đường sau bữa ăn, hỗ trợ giữ đường huyết và mỡ máu ổn định, đồng thời góp phần giữ cảm giác no lâu. Một bữa ăn tốt cần cả hai.</p>
<p>Mỗi ngày, phụ nữ dưới 50 tuổi cần khoảng 21–25 g chất xơ, nam giới dưới 50 tuổi khoảng 30–38 g. Cách dễ nhất để tới gần mức đó là để rau chiếm nửa đĩa và chọn tinh bột còn nguyên hạt.</p>
<p>Nếu trước giờ bạn ăn ít rau, hãy tăng từ từ và uống đủ nước, vì tăng chất xơ đột ngột có thể làm đầy hơi, khó chịu. Người có bệnh về đường ruột thì nên hỏi ý kiến bác sĩ, vì mỗi người một khác.</p>
<p><strong>Vitamin và khoáng chất: những dưỡng chất không thể thiếu</strong></p>
<p>Vitamin và khoáng chất, cơ thể chỉ cần một lượng nhỏ, nhưng chúng tham gia vào việc chuyển hoá năng lượng, hoạt động của thần kinh, cơ bắp, xương và hệ miễn dịch. Để dễ hình dung: canxi cho xương và răng có trong tôm, cua, cá, vừng, đậu nành, rau ngót, sữa. Sắt giúp tạo hồng cầu có trong thịt đỏ, thịt gia cầm, hải sản và rau lá xanh thẫm. Vitamin D giúp xương hấp thu canxi, có trong cá béo như cá thu, cá hồi và trong sữa. Vitamin C có nhiều trong cam, quýt, bông cải xanh, cà chua, ớt. Vitamin A tốt cho mắt có trong rau xanh đậm, cà rốt, lòng đỏ trứng. Còn iốt, cần cho tuyến giáp, có trong hải sản, sữa và trứng.</p>
<p>Điều này không có nghĩa là cứ uống thật nhiều vitamin thì cơ thể sẽ khoẻ hơn. Lượng vitamin đưa vào không đồng nghĩa với việc cơ thể dùng được nhiều gấp bấy nhiêu. Hàm lượng trong cùng một loại thực phẩm cũng thay đổi theo mùa vụ, đất trồng và cách bảo quản, và các chất còn ảnh hưởng lẫn nhau. Chẳng hạn canxi làm giảm hấp thu sắt, nên uống viên sắt cùng lúc với sữa hay viên canxi là làm hai chất cản nhau. Cơ thể con người quen xử lý thực phẩm toàn phần từ rất lâu, nên một bữa ăn đa dạng vẫn là nền tảng tốt nhất.</p>
<p>Các khuyến nghị dinh dưỡng mới còn đặt ra cả <em>ngưỡng tiêu thụ tối đa</em> cho nhiều vitamin và khoáng chất, vì dùng vượt mức cũng có thể gây hại. Vì vậy, đừng tự ý mua thực phẩm bổ sung chỉ vì thấy người khác dùng hay vì quảng cáo. Khi cơ thể thật sự thiếu một chất nào đó, việc bổ sung là cần thiết, nhưng nên được đánh giá cho từng người và có sự tư vấn của bác sĩ hay chuyên gia dinh dưỡng.</p>

<p>Bạn hãy nhìn vào chiếc đĩa của mình: <strong>khoảng một nửa là rau, một phần tư là đạm, một phần tư là tinh bột</strong>, ưu tiên loại nguyên hạt hay ít tinh chế. Khoai tây không tính vào phần rau, vì nó thuộc nhóm tinh bột. Lượng tinh bột có thể ước chừng bằng một nắm tay, lượng đạm bằng một lòng bàn tay. Bữa ăn đi kèm một ít dầu ăn tốt trong lúc chế biến, và đồ uống ít hoặc không đường.</p>
<p>Và khi ăn, hãy thử <strong>ăn rau trước, rồi đến đạm, tinh bột ăn sau</strong>, nhai chậm, dừng lại khi vừa no. Chỉ cần đổi thứ tự gắp, bữa ăn đã nhẹ nhàng hơn cho cơ thể.</p>
<p>Đây là cách hình dung đơn giản, không phải công thức bắt buộc cho tất cả mọi người. Nhu cầu thực tế còn tuỳ vào tuổi, giới, mức độ vận động và tình trạng sức khoẻ, nên không cần áp một chế độ ăn giống hệt nhau cho cả nhà. Chiếc đĩa này dành cho người trưởng thành khoẻ mạnh; trẻ nhỏ, bà bầu, người cao tuổi hay người đang có bệnh cần điều chỉnh riêng.</p>
<p>Điều Thuỷ muốn bạn ghi nhớ là: hãy hướng đến sự đa dạng, cân bằng và phù hợp, thay vì chỉ tập trung vào một loại thực phẩm duy nhất.</p>
<h4 class="h3">3. Ăn thế nào để chăm sóc cơ thể tốt hơn?</h4>
<p>Biết cơ thể cần gì là một chuyện. Biến điều đó thành thói quen hằng ngày lại là chuyện khác. Bạn không cần đổi hết cách ăn trong một ngày, chỉ cần bắt đầu từ những việc nhỏ, dễ làm và hợp với nhịp sống của mình.</p>
<p><strong>Ăn đa dạng, thay đổi thực phẩm thường xuyên.</strong> Nếu ngày nào bạn cũng ăn đi ăn lại vài món quen, hãy thử thêm một loại rau, một loại quả, một món đậu hay một loại cá mới. Càng nhiều loại, cơ thể càng có cơ hội nhận được nhiều dưỡng chất, và bữa ăn cũng phong phú, hấp dẫn hơn. Các khuyến nghị dinh dưỡng cập nhật gần đây cho người Việt Nam cũng nhấn mạnh điều này: không chỉ "ăn đủ" mà còn phải "ăn đúng", tức là chú ý cả chất lượng thực phẩm lẫn sự đa dạng của khẩu phần.</p>
<p><strong>Ăn đều đặn, đừng bỏ bữa.</strong> Không nhất thiết ai cũng phải ăn cùng số bữa hay cùng giờ, nhưng đừng để việc bỏ bữa, ăn vội hay ăn bù thành thói quen. Đặc biệt là bữa sáng. Nhiều người nhịn bữa sáng với hy vọng giảm cân, nhưng cơ thể thiếu năng lượng sẽ mệt hơn, chuyển hoá chậm lại, đến bữa sau lại dễ ăn bù khiến đường trong máu lên xuống thất thường. Ăn đều và đúng giờ giúp cơ thể ổn định hơn nhiều.</p>
<p><strong>Ăn chậm, lắng nghe cơ thể.</strong> Từ lúc thức ăn xuống dạ dày đến lúc não nhận ra bạn đã no cần khoảng 20 phút. Ăn quá nhanh nghĩa là bạn ăn xong trước khi cơ thể kịp báo "đủ rồi". Hãy thử nhai kỹ hơn thường ngày, kéo dài bữa ăn thêm 5–10 phút, hay đơn giản là đặt đũa xuống sau mỗi miếng cơm. Bớt vừa ăn vừa làm việc khác để bạn nhận ra mình đã ăn bao nhiêu và lúc nào là vừa no. Nhai kỹ còn giúp dạ dày đỡ phải gánh phần việc nghiền thức ăn thay cho hàm răng.</p>
<p><strong>Để ý đường, muối và đồ chế biến sẵn.</strong> Nước ngọt, trà sữa, bánh kẹo và nhiều món chế biến sẵn có thể chứa nhiều đường, nhiều muối và nhiều năng lượng mà ít chất bổ đi kèm. Theo khuyến nghị cho người Việt Nam, lượng đường thêm vào không nên vượt quá 10% năng lượng cả ngày, và nếu xuống dưới 5% thì càng tốt cho sức khoẻ. Đường không đáng sợ ở một lần ăn; nó tích luỹ qua việc một chút lặp lại nhiều lần mỗi ngày. Giảm ngọt cũng không có nghĩa là nhịn ăn, bỏ cơm hay bỏ trái cây. Bạn chỉ cần ăn thưa hơn, ít hơn và thay dần bằng thực phẩm tươi, không cần cấm tuyệt đối món mình thích.</p>
<p>Muối cũng vậy. Thức ăn tự nhiên đã chứa đủ natri cho cơ thể, nên điều cần là đừng để thừa, vì natri thừa kéo dài liên quan đến phù và tăng huyết áp. Có một chỗ muối hay lọt vào bữa ăn mà ít ai tính: bát canh. Vài muỗng nước mắm, hạt nêm, đường, bột ngọt hoà trong một nồi canh thì cả nhà húp hết, trong khi ăn riêng từng thứ ấy thì chẳng ai ăn nổi. Bạn có thể nêm canh nhạt hơn, húp vừa phải, và ăn cơm riêng, canh riêng thay vì chan.</p>
<p><strong>Không chạy theo chế độ ăn cực đoan.</strong> Một chế độ ăn phù hợp cần đáp ứng đủ nhu cầu của cơ thể và giữ được lâu dài. Cắt bỏ nhiều nhóm thực phẩm hay ăn quá ít khiến cơ thể thiếu hụt, và bạn cũng khó theo đuổi được bền. Nếu cần chế độ ăn riêng vì bệnh lý hay mục tiêu sức khoẻ cụ thể, hãy hỏi người có chuyên môn.</p>
<p>Thuỷ muốn bạn nhớ: một bữa ăn tốt không cần cầu kỳ hay đắt tiền. Thêm một đĩa rau, đổi một nguồn đạm, hay ngồi xuống ăn tử tế hơn một chút đã là một bước tiến rồi.</p>
<div class="quote"><p><strong>Câu hỏi cho bạn:</strong></p><ul><li>Mỗi ngày bạn có thật sự để ý mình đang ăn gì, hay thường ăn theo thói quen và cảm giác đói?</li><li>Nếu cơ thể có thể nói với bạn một câu về cách bạn đang chăm sóc nó, bạn nghĩ hôm nay cơ thể sẽ muốn nói điều gì?</li><li>Nếu xem mỗi bữa ăn là một cách chăm sóc cơ thể, bạn muốn bắt đầu thay đổi thói quen ăn uống nào để cơ thể khoẻ mạnh hơn mỗi ngày?</li><li>Bạn muốn bữa ăn hằng ngày mang lại cho cơ thể mình điều gì: năng lượng hơn, ngủ ngon hơn, da đẹp hơn, hay khoẻ để chăm lo cho gia đình?</li><li>Bạn có thường bỏ bữa, ăn quá muộn hoặc ăn nhiều vào một thời điểm trong ngày không? Thói quen đó ảnh hưởng đến cơ thể bạn như thế nào?</li></ul></div>
<hr class="brk">
<h3 class="h2">PHẦN 2. CHĂM SÓC CƠ THỂ KHÔNG CHỈ CÓ ĂN UỐNG</h3>
<p>Ăn uống là nền móng, nhưng cơ thể còn cần ba người bạn đồng hành nữa: nước, giấc ngủ và vận động. Thiếu một trong ba, bữa ăn tốt đến đâu cũng khó phát huy hết giá trị.</p>

<p>Nếu dinh dưỡng cung cấp năng lượng và nguyên liệu cho cơ thể, thì nước là thành phần thiết yếu để mọi hoạt động sống diễn ra suôn sẻ. Nước tham gia vận chuyển các chất, điều hoà thân nhiệt, hỗ trợ tiêu hoá và giữ cho các cơ quan hoạt động. Cơ thể mất nước liên tục qua mồ hôi, nước tiểu và hơi thở, nên cần được bổ sung đều đặn.</p>
<p>Có một điều ít người để ý: khát là tín hiệu báo muộn. Khi thiếu nước, các bộ phận trong cơ thể không thiếu cùng một lúc, và cũng không phải bộ phận nào cũng biết "kêu". Cảm giác khát chỉ xuất hiện khi não bộ đã thiếu nước, nghĩa là nhiều bộ phận khác đã thiếu từ trước đó. Vì vậy hãy uống nước như cách bạn ăn theo bữa và ngủ theo giờ: theo thói quen, đừng đợi đến lúc khát mới nhớ.</p>
<p>Một khung đơn giản để bắt đầu là bốn thời điểm trong ngày. Cốc đầu tiên và quan trọng nhất là ngay khi vừa ngủ dậy, vì sau một đêm dài cơ thể đang thiếu nước nhất; bạn có thể đặt sẵn một cốc nước cạnh giường từ tối hôm trước. Cốc thứ hai là trước bữa ăn khoảng nửa tiếng đến một tiếng, để dạ dày sẵn sàng cho bữa ăn tới. Cốc thứ ba là trước khi tắm khoảng nửa tiếng. Cốc cuối cùng là trước khi đi ngủ khoảng một tiếng, vừa đủ để bạn kịp đi vệ sinh trước khi lên giường. Phần còn lại của ngày, bạn rải đều vào những khoảng nghỉ, mỗi lần một cốc vừa phải.</p>
<p>Hãy uống chậm, từng ngụm nhỏ, đừng uống ừng ực hay dồn thật nhiều một lúc. Uống quá nhiều trong thời gian ngắn cũng có thể gây hại, và nước uống ngay trong bữa ăn làm dịch vị loãng đi, khiến bữa ăn khó tiêu hơn. Trong bữa, húp canh vừa phải là được, nhưng đừng thay bằng một cốc nước lớn.</p>
<p>Nhu cầu nước không giống nhau ở mọi người. Nó thay đổi theo cân nặng, tuổi, mức độ vận động, thời tiết và tình trạng sức khoẻ; người làm việc ngoài trời hay ra nhiều mồ hôi cần nhiều hơn. Con số "hai lít mỗi ngày" nghe khắp nơi vì vậy không đúng cho tất cả mọi người. Hơn nữa, nước vào cơ thể không chỉ qua cốc nước: canh, rau, quả, sữa cũng góp phần, nên phần bạn phải uống bằng miệng luôn nhỏ hơn tổng nhu cầu nước của cơ thể.</p>
<p>Nước lọc là lựa chọn tốt nhất để bổ sung nước hằng ngày. Có một cách phân biệt rất dễ: thứ bạn uống có năng lượng không? Nếu có, nó là đồ ăn chứ không phải nước. Nước ngọt, trà sữa, nước ép đóng chai tuy cũng là nước nhưng mang theo nhiều đường, nên không thay được cốc nước lọc.</p>
<p>Cách biết mình uống đủ rõ nhất là nhìn vào chính cơ thể: nước tiểu màu nhạt, da đỡ khô, người đỡ uể oải, ngủ sâu hơn. Một việc nhỏ bạn có thể thử ngay hôm nay: đặt một cốc nước ở chỗ dễ nhìn thấy nhất. Chăm sóc cơ thể đôi khi bắt đầu từ một việc giản dị như vậy.</p>
<h4 class="h3">5. Giấc ngủ – khoảng thời gian cơ thể nghỉ ngơi và phục hồi</h4>
<p>Bạn có thể ăn uống khá tốt, nhưng nếu thường xuyên ngủ quá ít hoặc ngủ không đều đặn, cơ thể vẫn khó giữ được sức khoẻ và năng lượng cho mỗi ngày. Khi bạn ngủ, cơ thể không tắt máy. Đó là lúc nó nghỉ ngơi, sửa chữa và phục hồi. Giấc ngủ có vai trò quan trọng với hoạt động của não bộ, khả năng tập trung, trí nhớ và điều hoà cảm xúc. Thiếu ngủ, bạn dễ uể oải, khó tập trung, dễ cáu gắt.</p>
<p>Làn da là nơi nhìn thấy điều đó rõ nhất. Trong lúc ngủ, cơ thể tiết ra melatonin, chất có vai trò chống oxy hoá và giúp da phục hồi tổn thương. Có tài liệu dinh dưỡng cho biết chỉ cần thiếu ngủ hai đêm liên tục, mỗi đêm dưới 5 giờ, da đã có thể sạm, khô và sần hơn. Thiếu ngủ kéo dài thì quầng thâm rõ hơn, da chậm tự sửa chữa, và các dấu hiệu lão hoá hiện ra sớm hơn. Vì vậy ngủ đủ giấc được xem là cách làm đẹp da đơn giản nhất mà không tốn đồng nào. Sáng dậy, bạn sẽ thấy rõ điều đó trên gương mặt mình.</p>
<p>Nếu bạn thường xuyên thức khuya vì công việc, vì chăm sóc gia đình hay vì chiếc điện thoại, hãy thử điều chỉnh từng bước. Bạn có thể bắt đầu bằng giờ đi ngủ và thức dậy ổn định hơn, bớt điện thoại và cà phê vào buổi tối, và một cốc nước trước giờ đi ngủ khoảng một tiếng. Nếu khó ngủ, một cốc sữa ấm không đường cũng là lựa chọn nhẹ nhàng.</p>
<p>Đừng xem giấc ngủ là thời gian lãng phí, hay là phần thưởng chỉ dành cho khi đã làm xong mọi việc. Nghỉ ngơi cũng là một phần của chăm sóc sức khoẻ. Và nếu thường xuyên khó ngủ, ngủ không ngon hoặc buồn ngủ quá nhiều ban ngày, hãy đi khám để tìm nguyên nhân.</p>
<h4 class="h3">6. Vận động – giúp cơ thể duy trì sức mạnh và sự linh hoạt</h4>
<p>Cơ thể chúng ta được tạo ra để vận động. Thế nhưng với công việc văn phòng, việc nhà và nhiều giờ nhìn điện thoại, máy tính, không ít người dành phần lớn thời gian trong ngày để ngồi. Vận động thường xuyên giúp tim mạch, cơ bắp, xương khớp, chuyển hoá và tinh thần khoẻ hơn.</p>
<p>Với người trưởng thành, khuyến nghị của Tổ chức Y tế Thế giới là từ 150 đến 300 phút vận động mức vừa mỗi tuần, như đi bộ nhanh, đạp xe, cộng thêm ít nhất hai ngày có bài tập cho cơ bắp. Nghe 150 phút có vẻ nhiều, nhưng chia ra chỉ khoảng 30 phút mỗi ngày, 5 ngày một tuần. Nếu làm được nhiều hơn thì càng có thêm lợi ích.</p>
<p>Nhưng điều quan trọng nhất là: <strong>bất kỳ mức vận động nào cũng tốt hơn không vận động</strong>. Không có một ngưỡng tối thiểu nào bắt buộc phải đạt thì mới bắt đầu có lợi. Nếu lâu nay bạn gần như không vận động, mục tiêu đầu tiên không phải là 150 phút, mà là bắt đầu: đi bộ 10 phút mỗi ngày, đứng dậy đi lại sau mỗi giờ ngồi làm việc. Vận động cũng không nhất thiết phải đến phòng tập. Đi dạo, đạp xe, làm vườn, khiêu vũ, tập yoga… bạn có thể chọn những hoạt động mình yêu thích và hợp với khả năng của mình.</p>
<p>Ăn uống và vận động đi cùng nhau. Chỉ tập luyện mà ăn uống không đổi thường không đủ để giảm cân, ngược lại chỉ ăn mà ít vận động thì cơ thể cũng không khoẻ lên được. Điều quan trọng không phải là so sánh mình với người khác. Hãy bắt đầu từ mức cơ thể mình đáp ứng được, rồi tăng dần theo thời gian.</p>
<h4 class="h3">7. Những thói quen nhỏ tạo nên nền tảng sức khoẻ</h4>
<p>Chăm sóc sức khoẻ không nhất thiết phải bắt đầu bằng một kế hoạch thật lớn. Đôi khi chính những việc nhỏ được lặp lại mỗi ngày mới là điều bạn có thể giữ được lâu dài. Bạn có thể bắt đầu bằng việc chuẩn bị bữa ăn đa dạng hơn, thêm một màu rau vào mâm cơm, đổi nguồn đạm, uống nước đều đặn, đi ngủ đúng giờ hơn hoặc dành một khoảng thời gian để đi bộ.</p>
<p>Đừng cố làm tất cả cùng một lúc nếu điều đó khiến bạn thấy quá tải. Hãy chọn một hoặc hai thói quen dễ nhất, giữ cho đến khi chúng trở nên tự nhiên, rồi mới thêm thói quen khác.</p>
<p>Bạn cũng không cần tự trách mình khi có một ngày ăn uống chưa như mong muốn, ngủ muộn hoặc bỏ lỡ buổi vận động. Một ngày chưa hoàn hảo không có nghĩa là mọi nỗ lực trước đó đều mất đi. Hãy quay lại với những lựa chọn phù hợp ở bữa ăn tiếp theo, giấc ngủ tiếp theo và ngày tiếp theo. Thuỷ tin rằng sự bền bỉ bắt đầu từ những điều giản dị mà mình làm được, chứ không phải từ những mục tiêu quá lớn khiến mình nhanh chóng bỏ cuộc.</p>
<div class="quote"><p><strong>Câu hỏi cho bạn:</strong></p><ul><li>Có thói quen nào bạn biết là chưa tốt cho sức khoẻ nhưng vẫn duy trì mỗi ngày? Điều gì khiến bạn chưa thay đổi?</li><li>Nếu sức khoẻ là món quà bạn cần gìn giữ cho những người mình yêu thương, bạn sẽ bắt đầu trân trọng và chăm sóc bản thân khác đi như thế nào?</li><li>Điều gì đang ngăn bạn vận động đều đặn: thiếu thời gian, thiếu động lực, hay chưa biết bắt đầu từ đâu?</li><li>Hằng ngày, có khi nào bạn thay nước lọc bằng những thức uống khác không?</li><li>Nếu chỉ chọn một thói quen để bắt đầu trong tuần này: uống nước đều, ngủ sớm hơn, hay đi bộ mỗi ngày, bạn chọn thói quen nào?</li></ul></div>

<p>Có những ngày bạn biết rất rõ mình nên ăn gì, nhưng lại không làm được như dự định.</p>
<p>Có hôm công việc quá nhiều, bạn mải làm đến mức quên mất bữa trưa. Có hôm trong lòng nặng trĩu vì một chuyện buồn, bạn chẳng muốn ăn gì. Cũng có những ngày sau nhiều giờ căng thẳng, bạn chỉ muốn tìm đến một món quen thuộc, một chiếc bánh ngọt hay một ly trà sữa để thấy dễ chịu hơn. Điều đó xảy ra với rất nhiều người.</p>
<p>Khi căng thẳng, buồn bã, lo lắng hay mệt mỏi, có người ăn ít đi, có người lại thấy thèm ăn và tìm đến thức ăn như một cách tự vỗ về. Ăn thất thường thì cơ thể mệt, người mệt thì tâm trạng càng xuống, và vòng lặp cứ thế tiếp diễn. Không phải lúc nào ta cũng nhận ra ngay. Đôi khi mình chỉ thấy gần đây mình ăn thất thường hơn, hay bỏ bữa, ăn vội hơn, hoặc hay tìm đến đồ ăn vặt mỗi lần áp lực.</p>
<p>Chiều ngược lại cũng đúng. Một bữa ăn được ngồi xuống đàng hoàng, ăn chậm, đủ rau, đủ đạm, có khi cùng người thân, sẽ cho cơ thể năng lượng ổn định hơn, và cho lòng mình một khoảng dịu lại giữa ngày bận rộn. Tâm trạng ảnh hưởng tới bữa ăn, và bữa ăn cũng quay lại nâng đỡ tâm trạng.</p>
<p>Vì vậy, bên cạnh việc tìm hiểu thực phẩm nào phù hợp, chúng ta cũng cần học cách quan sát cảm xúc và nhận ra điều đang diễn ra bên trong mình. Lần tới, trước khi với tay lấy một món ăn vặt, bạn thử dừng lại vài giây và hỏi mình: <em>"Mình đang đói thật, hay mình đang mệt, đang buồn, đang cần được nghỉ?"</em> Câu hỏi ấy không nhằm phán xét bản thân. Nó chỉ giúp bạn nhận ra nhu cầu của mình rõ hơn.</p>
<p>Nếu đói thật, hãy cho cơ thể một bữa ăn tử tế. Nếu đang mệt, có khi điều bạn cần là nghỉ ngơi, đi bộ một chút, hay trò chuyện với người mình tin tưởng. Và đôi khi, cơn "đói" giữa buổi chỉ là cơ thể đang cần nước: bạn thử uống một cốc nước, đợi một chút, nếu vẫn đói thì đó là đói thật, hãy ăn. Đôi khi điều chúng ta cần không chỉ là thức ăn, mà còn là sự nghỉ ngơi và quan tâm đến cảm xúc.</p>
<p>Bữa cơm gia đình không chỉ là chuyện no bụng. Đó là lúc cả nhà ngồi xuống cạnh nhau, nhìn thấy nhau sau một ngày bận rộn. Người nấu thường lo cho mọi người trước, rồi quên mất phần mình. Hôm nay, bạn hãy trọn vẹn ăn cùng cả nhà, đặt điện thoại sang một bên, và nhớ rằng bạn cũng là một người trong mâm cơm cần được chăm sóc.</p>
<h4 class="h3">9. Đừng dùng thức ăn để trách phạt chính mình</h4>
<p>Có người sau một bữa ăn nhiều hơn dự định sẽ thấy tội lỗi. Họ tự trách mình thiếu kỷ luật, rồi cố nhịn ăn, hoặc đặt ra những quy tắc khắt khe hơn vào ngày hôm sau. Nhưng liên tục trách móc bản thân chỉ khiến hành trình chăm sóc sức khoẻ thêm nặng nề.</p>
<p>Một bữa ăn không quyết định toàn bộ sức khoẻ của bạn. Một lần ăn nhiều hơn dự định cũng không có nghĩa là bạn đã thất bại. Và nhịn đói hôm sau để "bù" cũng không giúp ích: cơ thể thiếu năng lượng sẽ mệt hơn, đường trong máu dao động, và bữa kế tiếp lại dễ ăn bù thêm lần nữa. Cách đúng là quay lại ngay nhịp bình thường, ăn cân đối, sinh hoạt như thường, vận động nhẹ nhàng.</p>
<p>Thay vì nghĩ rằng mình đã làm sai tất cả, bạn thử nhẹ nhàng hỏi: <em>"Bữa ăn vừa rồi chưa thật sự hợp với điều mình mong muốn. Lần sau mình có thể điều chỉnh điều gì?"</em> Có thể bạn cần chuẩn bị bữa ăn trước khi đi làm. Có thể bạn cần ăn đều hơn để không quá đói vào cuối ngày. Cũng có thể bạn cần tìm cách nghỉ ngơi và giải toả căng thẳng thay vì chỉ cố gắng kiểm soát thức ăn.</p>
<p>Chăm sóc sức khoẻ không phải cuộc chiến giữa bạn và cơ thể mình, mà là học cách hiểu và thương nó hơn.</p>
<p>Bạn xứng đáng được chăm sóc bằng sự tôn trọng, không phải bằng những lời trách móc.</p>
<h4 class="h3">10. Chăm sóc cảm xúc cũng là một phần của chăm sóc sức khoẻ</h4>
<p>Khi nói đến sức khoẻ, nhiều người nghĩ ngay đến thực phẩm, cân nặng, xét nghiệm hay việc tập luyện. Nhưng sức khoẻ còn gắn với cách chúng ta nghỉ ngơi, ứng phó với căng thẳng và gìn giữ những mối quan hệ trong cuộc sống. Căng thẳng là một phần tự nhiên của cuộc sống. Điều quan trọng là nhận ra khi nào mình đang chịu quá nhiều áp lực và tìm cách ứng phó phù hợp.</p>
<p>Chăm sóc cảm xúc cũng cần được dành thời gian, giống như bữa ăn và giấc ngủ. Khi thấy mình căng thẳng, bạn có thể thử những việc rất nhỏ: dừng tay vài phút và hít thở chậm vài hơi, ra ngoài đi bộ một vòng, viết ra giấy điều đang khiến mình lo, hoặc gọi cho một người mình tin tưởng.</p>
<p>Hãy cho phép mình có cảm xúc mà không vội phán xét. Buồn không có nghĩa là yếu đuối. Mệt không có nghĩa là lười biếng. Tức giận không có nghĩa là bạn là người xấu, và lo lắng cũng không có nghĩa là bạn không đủ mạnh mẽ. Đó chỉ là những tín hiệu cho biết bạn đang cần được quan tâm nhiều hơn một chút. Điều chúng ta có thể học là nhận biết chúng, hiểu điều gì đang góp phần tạo nên chúng, và chọn cách đáp lại nhẹ nhàng hơn.</p>
<p>Khi chăm sóc cảm xúc, bạn cũng dễ nhận ra những lúc mình ăn uống thất thường vì áp lực, quên nghỉ ngơi hay bỏ qua nhu cầu của cơ thể.</p>
<p>Điều này không có nghĩa rằng chỉ cần suy nghĩ tích cực là mọi vấn đề sức khoẻ sẽ biến mất. Sức khoẻ chịu ảnh hưởng của nhiều yếu tố: dinh dưỡng, vận động, giấc ngủ, môi trường sống, điều kiện xã hội và tình trạng y tế của mỗi người. Nhưng quan tâm đến cảm xúc là một phần có ý nghĩa trong hành trình chăm sóc bản thân toàn diện. Hãy chăm sóc cơ thể bằng dinh dưỡng phù hợp, và cũng hãy dành cho tâm trí mình sự quan tâm mà nó cần.</p>
<div class="quote"><p><strong>Câu hỏi cho bạn:</strong></p><ul><li>Khi căng thẳng, bạn thường ăn nhiều hơn, ăn ít đi, hay tìm đến một món quen nào đó?</li><li>Bạn đã dành bao nhiêu thời gian mỗi ngày để chăm sóc cảm xúc của mình, giống như cách bạn chăm sóc cơ thể bằng ăn uống và nghỉ ngơi?</li><li>Nếu hôm nay bạn có thể nhẹ nhàng nói với chính mình một điều, bạn muốn nói điều gì?</li><li>Có khi nào bạn nhận ra mình đang ăn để lấp đầy một cảm giác trống trải, cô đơn hoặc mệt mỏi, chứ không phải vì đói?</li><li>Bạn đã bao lâu rồi chưa thật sự lắng nghe những thay đổi mà cơ thể đang âm thầm gửi đến mình?</li></ul></div>

<p>Và khi có một ngày chưa làm được như mong muốn, hãy cho mình cơ hội bắt đầu lại.</p>

<p>Nhưng bạn biết không, chăm sóc bản thân không phải là ích kỷ. Đó là một phần quan trọng để bạn có thể sống khoẻ mạnh hơn và tiếp tục chăm lo cho những người mình yêu thương.</p>
<p>Mỗi lần bạn lựa chọn một bữa ăn đa dạng hơn, dành thời gian nghỉ ngơi khi mệt mỏi hoặc bước ra ngoài đi bộ thay vì ngồi quá lâu, bạn đang thực hiện một hành động nhỏ để quan tâm đến chính mình.</p>
<p>Bạn không cần trở thành một người hoàn hảo. Bạn chỉ cần học cách hiểu cơ thể hơn, lắng nghe cảm xúc hơn và từng bước xây dựng những thói quen phù hợp với cuộc sống của mình.</p>

  var sx=null; stage.addEventListener('touchstart',function(e){ sx=e.touches[0].clientX; },{passive:true});
  stage.addEventListener('touchend',function(e){ if(sx===null) return; var dx=e.changedTouches[0].clientX-sx; if(Math.abs(dx)>50) go(dx<0?1:-1); sx=null; });
  var rt; window.addEventListener('resize',function(){ clearTimeout(rt); rt=setTimeout(build,200); });
  document.addEventListener('contextmenu',function(e){ e.preventDefault(); });
  document.addEventListener('copy',function(e){ e.preventDefault(); });
  document.addEventListener('dragstart',function(e){ e.preventDefault(); });
  if(document.fonts && document.fonts.ready){ document.fonts.ready.then(build); } else { build(); }
  window.addEventListener('load', function(){ builtFor=''; build(); });
})();
</script>
